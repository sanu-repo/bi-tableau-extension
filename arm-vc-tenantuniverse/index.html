<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tenant Universe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="js/tableau.extensions.1.latest.min.js"></script>
  <style>
    :root {
      --bg: #F7F5F0; --surface: #FFFFFF; --surface2: #F0EDE8;
      --border: #E8E4DD; --accent: #D4782F; --text: #1A1A1A;
      --text-secondary: #4A4A4A; --text-muted: #6B6B6B;
      --danger: #C62828; --radius: 8px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: var(--font); background: transparent; color: var(--text); overflow: hidden; }

    #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Header ── */
    #header {
      padding: 14px 20px 12px; background: var(--surface);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .header-eyebrow {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--text-muted); margin-bottom: 4px;
    }
    #header h1 { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .header-subtitle { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

    /* ── Data cap ── */
    #data-cap-notice {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 20px; background: #FFFDE7; border-bottom: 1px solid #FFE082;
      font-size: 11px; font-weight: 500; color: #E65100; flex-shrink: 0;
    }

    /* ── KPI cards ── */
    #kpi-cards {
      display: flex; flex-shrink: 0;
      background: var(--surface); border-top: 3px solid var(--accent); border-bottom: 1px solid var(--border);
    }
    .kpi-card-item { flex: 1; min-width: 0; padding: 14px 20px; border-left: 1px solid var(--border); }
    .kpi-card-item:first-child { border-left: none; }
    .kpi-card-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-muted); margin-bottom: 6px;
    }
    .kpi-card-value { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1.1; }
    .kpi-card-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .kpi-card-delta { font-size: 12px; font-weight: 600; margin-top: 4px; line-height: 1.4; }
    .kpi-card-delta.up   { color: #2E7D32; }
    .kpi-card-delta.down { color: var(--danger); }

    /* ── Filter bar ── */
    #filter-bar {
      display: flex; align-items: center; justify-content: space-between; padding: 9px 20px;
      gap: 10px; flex-shrink: 0; flex-wrap: wrap;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .filter-bar-left, .filter-bar-right {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .filter-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 13px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; font-size: 12px; font-weight: 500; color: var(--text-muted);
      cursor: pointer; user-select: none; white-space: nowrap; font-family: var(--font);
      transition: background .14s, border-color .14s, box-shadow .14s;
    }
    .filter-pill:hover { background: var(--surface2); border-color: #c5c0b9; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
    .filter-pill.active { background: rgba(212,120,47,.10); border-color: var(--accent); color: var(--text); }
    .pill-chevron { font-size: 10px; color: var(--text-muted); }
    .filter-pill.active .pill-chevron { color: var(--accent); }
    .pill-clear { font-size: 14px; line-height: 1; color: var(--text-muted); padding: 0 2px; cursor: pointer; transition: color .12s; }
    .pill-clear:hover { color: var(--danger); }
    .pill-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; padding: 0 5px;
      background: var(--accent); color: #fff; border-radius: 9px;
      font-size: 10px; font-weight: 700; line-height: 1;
    }
    .filter-clear-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 12px; background: transparent; border: 1px solid var(--border);
      border-radius: 20px; font-size: 12px; font-weight: 500; color: var(--text-muted);
      cursor: pointer; white-space: nowrap; font-family: var(--font);
      transition: color .14s, border-color .14s;
    }
    .filter-clear-btn:hover { color: var(--danger); border-color: var(--danger); }
    .filter-dropdown {
      position: fixed; z-index: 200; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,.14);
      min-width: 200px; max-width: 260px; max-height: 320px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .filter-dropdown-body { overflow-y: auto; flex: 1; }
    .filter-dropdown-body::-webkit-scrollbar { width: 4px; }
    .filter-dropdown-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .filter-dropdown-item {
      display: flex; align-items: center; gap: 9px; padding: 9px 14px;
      font-size: 13px; color: var(--text); cursor: pointer; transition: background .1s;
    }
    .filter-dropdown-item:hover { background: var(--surface2); }
    .filter-dropdown-item input[type="checkbox"],
    .filter-dropdown-item input[type="radio"] { accent-color: var(--accent); width: 14px; height: 14px; flex-shrink: 0; cursor: pointer; }
    .filter-dropdown-footer { display: flex; justify-content: space-between; padding: 8px 14px; border-top: 1px solid var(--border); }
    .filter-dropdown-footer button {
      background: none; border: none; font-size: 12px; font-family: var(--font);
      color: var(--accent); cursor: pointer; padding: 2px 0; font-weight: 500;
    }
    .filter-dropdown-footer button:hover { text-decoration: underline; }
    .date-preset-item {
      display: flex; align-items: center; gap: 9px; padding: 9px 14px;
      font-size: 13px; color: var(--text); cursor: pointer; transition: background .1s;
    }
    .date-preset-item:hover { background: var(--surface2); }
    .date-preset-item.selected { font-weight: 600; color: var(--accent); }
    .preset-dot { font-size: 11px; flex-shrink: 0; color: var(--text-muted); }
    .date-preset-item.selected .preset-dot { color: var(--accent); }
    .date-custom-inputs { flex-direction: column; gap: 7px; padding: 10px 14px 8px; border-top: 1px solid var(--border); background: var(--surface2); }
    .date-custom-row { display: flex; align-items: center; gap: 8px; }
    .date-custom-row label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); width: 30px; flex-shrink: 0; }
    .date-custom-row input[type="date"] { flex: 1; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-family: var(--font); color: var(--text); background: var(--surface); outline: none; }
    .date-custom-row input[type="date"]:focus { border-color: var(--accent); }
    .date-apply-btn { padding: 6px 14px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 12px; font-family: var(--font); font-weight: 500; cursor: pointer; width: 100%; margin-top: 2px; }
    .date-apply-btn:hover { opacity: .88; }

    /* ── Main: accordion ── */
    #main { flex: 1; min-height: 0; overflow-y: auto; display: none; }
    #main::-webkit-scrollbar { width: 6px; }
    #main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .cat-block { border-bottom: 1px solid var(--border); }
    .cat-block:last-child { border-bottom: none; }

    .cat-row {
      display: flex; align-items: center; padding: 0 20px; min-height: 64px;
      gap: 16px; cursor: pointer; background: var(--surface);
      transition: background .12s; user-select: none;
    }
    .cat-row:hover { background: var(--surface2); }

    .cat-chevron { flex-shrink: 0; color: var(--text-muted); font-size: 13px; display: inline-block; transition: transform .2s; line-height: 1; }
    .cat-chevron.open { transform: rotate(90deg); }

    .cat-name-wrap { flex: 1; min-width: 0; }
    .cat-name { font-size: 15px; font-weight: 700; color: var(--text); }
    .cat-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .cat-kpis { display: flex; flex-shrink: 0; }
    .cat-kpi { min-width: 140px; padding: 4px 18px; border-left: 1px solid var(--border); }
    .cat-kpi-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-bottom: 3px; }
    .cat-kpi-value { font-size: 15px; font-weight: 700; color: var(--text); }
    .cat-kpi-value.yoy-pos { color: #2E7D32; }
    .cat-kpi-value.yoy-neg { color: var(--danger); }

    .cat-roster-btn {
      flex-shrink: 0; padding: 6px 14px; font-size: 12px; font-weight: 500;
      font-family: var(--font); border: 1px solid var(--border); border-radius: 20px;
      background: var(--surface); color: var(--text-muted);
      cursor: pointer; transition: border-color .14s, color .14s; white-space: nowrap;
    }
    .cat-roster-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Roster table ── */
    .roster-wrap { overflow-x: auto; }
    .roster-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .roster-table th {
      text-align: left; padding: 8px 16px;
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em;
      color: var(--text-muted); background: var(--surface2); border-bottom: 1px solid var(--border);
      white-space: nowrap; position: sticky; top: 0;
    }
    .roster-table td { padding: 11px 16px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
    .roster-table tr:last-child td { border-bottom: none; }
    .roster-table tbody tr { background: var(--surface); cursor: pointer; transition: background .1s; }
    .roster-table tbody tr:hover { background: rgba(212,120,47,.04); }
    .tenant-name-cell { font-weight: 600; }
    .location-cell { color: var(--text-secondary); }

    .sales-bar-wrap { display: flex; align-items: center; gap: 10px; }
    .sales-bar-track { width: 90px; height: 6px; background: var(--border); border-radius: 3px; flex-shrink: 0; overflow: hidden; }
    .sales-bar-fill { height: 6px; border-radius: 3px; }
    .sales-index-num { font-size: 13px; font-weight: 600; color: var(--text); min-width: 28px; }

    .yoy-pos { color: #2E7D32; font-weight: 600; }
    .yoy-neg { color: var(--danger); font-weight: 600; }

    .status-badge {
      display: inline-flex; align-items: center; padding: 2px 9px;
      border-radius: 12px; font-size: 11px; font-weight: 600; letter-spacing: .03em;
      border: 1px solid; white-space: nowrap;
    }
    .status-badge.watch    { background: #FFF3E0; color: #E65100; border-color: #FFCC80; }
    .status-badge.at-risk  { background: #FFEBEE; color: var(--danger); border-color: #EF9A9A; }
    .status-badge.generic  { background: var(--surface2); color: var(--text-muted); border-color: var(--border); }

    /* ── Gear button ── */
    #gear-btn {
      position: fixed; top: 8px; right: 8px; z-index: 50;
      width: 30px; height: 30px; border-radius: 6px;
      background: rgba(255,255,255,.92); border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .14s, color .14s, border-color .14s;
    }
    #app:hover #gear-btn { opacity: 1; }
    #gear-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* ── Empty state ── */
    #empty-state {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      flex: 1; gap: 10px; color: var(--text-muted); text-align: center; padding: 32px;
    }
    #empty-state h2 { font-size: 16px; color: var(--text); }
    #empty-state p { font-size: 14px; max-width: 300px; line-height: 1.5; }
    #empty-state button {
      margin-top: 6px; padding: 8px 20px; background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius); font-size: 14px; font-family: var(--font);
      font-weight: 500; cursor: pointer;
    }
    #empty-state button:hover { opacity: .88; }

    /* ── Tenant modal ── */
    #tenant-modal {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10,6,2,.48);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      opacity: 0; pointer-events: none; transition: opacity .18s;
    }
    #tenant-modal.open { opacity: 1; pointer-events: all; }

    .tenant-modal-card {
      background: var(--surface); border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,.24);
      width: calc(100% - 40px); max-width: 520px;
      max-height: calc(100vh - 60px); overflow-y: auto;
      transform: translateY(8px); transition: transform .18s;
      display: flex; flex-direction: column;
    }
    #tenant-modal.open .tenant-modal-card { transform: translateY(0); }
    .tenant-modal-card::-webkit-scrollbar { width: 4px; }
    .tenant-modal-card::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .modal-head { padding: 18px 48px 14px 20px; border-bottom: 1px solid var(--border); position: relative; }
    .modal-eyebrow { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin-bottom: 4px; }
    .modal-tenant-name { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 3px; line-height: 1.2; }
    .modal-subtitle-text { font-size: 13px; color: var(--text-muted); }
    .modal-close {
      position: absolute; top: 14px; right: 14px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted); font-size: 18px; line-height: 1;
      transition: color .14s, background .14s;
    }
    .modal-close:hover { color: var(--text); background: var(--border); }

    .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .kpi-tile { background: var(--surface); padding: 13px 14px; }
    .kpi-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin-bottom: 4px; }
    .kpi-value { font-size: 20px; font-weight: 700; color: var(--text); line-height: 1; }
    .kpi-value.accent { color: var(--accent); }
    .kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .modal-section { padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .modal-section:last-child { border-bottom: none; }
    .section-eyebrow { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin-bottom: 6px; }
    .section-heading { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 12px; }

    .store-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .store-row:last-child { border-bottom: none; }
    .store-info { flex: 1; min-width: 0; }
    .store-location-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .store-meta-text { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .store-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; padding-left: 12px; }
    .store-value-text { font-size: 14px; font-weight: 700; color: var(--text); }
    .store-status-badge {
      display: inline-flex; align-items: center; padding: 2px 8px;
      border-radius: 10px; font-size: 11px; font-weight: 600; border: 1px solid;
    }
    .store-status-badge.active   { background: #E8F5E9; color: #2E7D32; border-color: #A5D6A7; }
    .store-status-badge.inactive { background: var(--surface2); color: var(--text-muted); border-color: var(--border); }
    .modal-bottom { height: 8px; }
  </style>
</head>
<body>
<div id="app">

  <div id="header">
    <div class="header-eyebrow">Existing Tenant Universe</div>
    <h1>Top performing tenants by category</h1>
    <p class="header-subtitle">Sales index = sales per sqm vs portfolio average (100). YoY = 12-month rolling. OCR = occupancy cost ratio.</p>
  </div>

  <div id="kpi-cards" style="display:none;"></div>
  <div id="data-cap-notice" style="display:none;"></div>
  <div id="filter-bar" style="display:none;"></div>

  <div id="main"></div>

  <div id="empty-state">
    <h2>Tenant Universe</h2>
    <p>Connect your source worksheet and map fields to display tenant performance by category.</p>
    <button id="empty-config-btn">Configure Extension</button>
  </div>

  <button id="gear-btn" hidden aria-label="Configure">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <div id="tenant-modal">
    <div class="tenant-modal-card" id="tenant-modal-card"></div>
  </div>

</div>
<script>
'use strict';
(function () {

  var tableauReady  = false;
  var rawRows       = [];
  var activeFilters = {};
  var currentDropdownEl = null;
  var MAX_ROWS = 50000;
  var BAR_SCALE = 200;

  var cfg = {
    sourceWorksheet: '',
    fieldMappings: {
      categoryField: '', categorySqftField: '', categoryYoyField: '',
      tenantField: '', brandCodeField: '', tenantCodeField: '', tenantStatusField: '',
      salesIndexField: '', tenantYoyField: '', ocrField: '', statusField: '',
      locationField: '', levelField: '', leaseEndField: '', sqmField: '', leaseValueField: '', storeStatusField: '',
      salesCurrentPeriodField: '', salesPerSqmField: '', salesPriorPeriodField: '', matRentField: '',
      storeCountField: '',
    },
    columnLabels: {
      tenantLabel: 'Tenant', locationLabel: 'Primary Location', salesIndexLabel: 'Sales Index',
      salesCurrentLabel: 'Sales (AED)', salesPerSqmLabel: 'Sales/Sqm', yoyLabel: 'YoY Growth',
      ocrLabel: 'OCR', storesLabel: 'Stores', statusLabel: 'Status',
    },
    columnVisibility: {
      salesIndexVisible: true, salesCurrentVisible: true, salesPerSqmVisible: true,
      yoyVisible: true, ocrVisible: true, storesVisible: true, statusVisible: true,
    },
    bands: [
      { color: '#2E7D32', threshold: 130 },
      { color: '#D4782F', threshold: 100 },
      { color: '#C62828', threshold: 0   },
    ],
    filterConfig: null,
  };

  var activeSort = null;
  var portfolioKpis = null;
  var openCategories = {};

  var SORT_METRICS = [
    { key: 'salesCurrentPeriodField', prop: 'salesCurrentPeriod', label: 'By Sales' },
    { key: 'salesPerSqmField',        prop: 'salesPerSqm',        label: 'By Sales/Sqm' },
    { key: 'ocrField',                prop: 'ocr',                label: 'By OCR' },
    { key: 'tenantYoyField',          prop: 'tenantYoy',          label: 'By YOY Growth' },
  ];

  var MOCK_MODE = window.location.search.indexOf('mock') >= 0;

  var DATE_PRESETS = [
    { key: 'all',    label: 'All Time' },
    { key: 'last7',  label: 'Last 7 days' },
    { key: 'last14', label: 'Last 14 days' },
    { key: 'last30', label: 'Last 30 days' },
    { key: 'last60', label: 'Last 60 days' },
    { key: 'last90', label: 'Last 90 days' },
    { key: 'mtd',    label: 'Month to Date' },
    { key: 'qtd',    label: 'Quarter to Date' },
    { key: 'ytd',    label: 'Year to Date' },
    { key: 'custom', label: 'Custom range…' },
  ];

  var $kpiCards      = document.getElementById('kpi-cards');
  var $filterBar     = document.getElementById('filter-bar');
  var $dataCapNotice = document.getElementById('data-cap-notice');
  var $main          = document.getElementById('main');
  var $emptyState    = document.getElementById('empty-state');
  var $gearBtn       = document.getElementById('gear-btn');
  var $modal         = document.getElementById('tenant-modal');
  var $modalCard     = document.getElementById('tenant-modal-card');

  // ── Init ──────────────────────────────────────────────────────────────────
  window.addEventListener('load', function () {
    if (MOCK_MODE) { loadMockData(); return; }
    tableau.extensions.initializeAsync({ configure: openConfig }).then(function () {
      tableauReady = true;
      var mode = tableau.extensions.environment.mode;
      if (!mode || mode === 'authoring') {
        $gearBtn.hidden = false;
        $gearBtn.addEventListener('click', openConfig);
      }
      document.getElementById('empty-config-btn').addEventListener('click', openConfig);
      tableau.extensions.settings.addEventListener(
        tableau.TableauEventType.SettingsChanged,
        function () { loadSavedConfig(); fetchAndRender(); }
      );
      loadSavedConfig();
      fetchAndRender();
    }).catch(function () { showEmpty(); });
  });

  function loadSavedConfig() {
    try {
      var all = tableau.extensions.settings.getAll();
      if (all.sourceWorksheet)  cfg.sourceWorksheet  = all.sourceWorksheet;
      if (all.fieldMappings)    cfg.fieldMappings    = JSON.parse(all.fieldMappings);
      if (all.columnLabels)     cfg.columnLabels     = JSON.parse(all.columnLabels);
      if (all.columnVisibility) cfg.columnVisibility = JSON.parse(all.columnVisibility);
      if (all.bands)            cfg.bands            = JSON.parse(all.bands);
      if (all.filterConfig)     cfg.filterConfig     = JSON.parse(all.filterConfig);
    } catch (e) {}
  }

  function openConfig() {
    if (!tableauReady) return;
    var url = window.location.href.replace(/\/[^\/]*$/, '/dialog.html');
    tableau.extensions.ui.displayDialogAsync(url, '', { height: 680, width: 620 })
      .then(function (result) {
        if (result === 'saved') { loadSavedConfig(); fetchAndRender(); }
      })
      .catch(function (err) {
        if (err.errorCode !== tableau.ErrorCodes.DialogClosedByUser) console.error(err);
      });
  }

  // ── Data fetch ────────────────────────────────────────────────────────────
  function fetchAndRender() {
    if (!cfg.sourceWorksheet) { showEmpty(); return; }
    var ws = null;
    var sheets = tableau.extensions.dashboardContent.dashboard.worksheets;
    for (var i = 0; i < sheets.length; i++) {
      if (sheets[i].name === cfg.sourceWorksheet) { ws = sheets[i]; break; }
    }
    if (!ws) { showEmpty(); return; }

    ws.getSummaryDataAsync({ maxRows: MAX_ROWS }).then(function (dt) {
      rawRows = parseDataTable(dt);
      checkDataCap();
      initActiveFilters();
      renderFilterBar();
      applyAndRender();
    }).catch(function () { showEmpty(); });
  }

  function parseDataTable(dt) {
    var cols = dt.columns.map(function (c) { return c.fieldName; });
    return dt.data.map(function (row) {
      var obj = {};
      cols.forEach(function (col, i) { obj[col] = row[i].formattedValue; });
      return obj;
    });
  }

  function checkDataCap() {
    if (rawRows.length >= MAX_ROWS) {
      $dataCapNotice.style.display = 'flex';
      $dataCapNotice.innerHTML = '&#9888; Showing top ' + MAX_ROWS.toLocaleString() + ' records — data has been capped. Apply a filter on the source worksheet to narrow the dataset.';
    } else {
      $dataCapNotice.style.display = 'none';
    }
  }

  // ── Portfolio KPI cards ───────────────────────────────────────────────────
  function computePortfolioKpis(rows) {
    var fld = cfg.fieldMappings;
    var seenBrands = {}, seenLeases = {};
    var activeBrandCount = 0, activeLeaseCount = 0;
    var matSales = 0, priorSales = 0, matRent = 0, totalArea = 0;

    rows.forEach(function (row) {
      if (isActiveTenantStatus(fld, row)) {
        // Active Brands = distinct Brand Code; falls back to tenant name if unmapped.
        var brandKey = fld.brandCodeField ? normalizeTenantKey(row[fld.brandCodeField])
          : (fld.tenantField ? normalizeTenantKey(row[fld.tenantField]) : '');
        if (brandKey && !seenBrands[brandKey]) { seenBrands[brandKey] = true; activeBrandCount++; }

        // Active Leases = distinct Tenant Code; falls back to counting every row if unmapped.
        var leaseKey = fld.tenantCodeField ? normalizeTenantKey(row[fld.tenantCodeField]) : '';
        if (leaseKey) {
          if (!seenLeases[leaseKey]) { seenLeases[leaseKey] = true; activeLeaseCount++; }
        } else {
          activeLeaseCount++;
        }
      }

      if (fld.salesCurrentPeriodField) matSales   += parseNumeric(row[fld.salesCurrentPeriodField]) || 0;
      if (fld.salesPriorPeriodField)   priorSales += parseNumeric(row[fld.salesPriorPeriodField])   || 0;
      if (fld.matRentField)            matRent    += parseNumeric(row[fld.matRentField])            || 0;
      if (fld.sqmField)                totalArea  += parseNumeric(row[fld.sqmField])                || 0;
    });

    return {
      activeBrandCount:  activeBrandCount,
      activeLeaseCount:  activeLeaseCount,
      matSales:          matSales,
      priorSales:        priorSales,
      yoyPct:            priorSales > 0 ? ((matSales - priorSales) / priorSales * 100) : null,
      ocrPct:            matSales   > 0 ? (matRent / matSales * 100)                   : null,
      avgSalesPerSqm:   totalArea  > 0 ? (matSales / totalArea)                       : null,
    };
  }

  function renderKpiCards(k) {
    $kpiCards.innerHTML = '';
    $kpiCards.appendChild(kpiCardItem('Active Leases', k.activeLeaseCount.toLocaleString(), 'across portfolio'));
    $kpiCards.appendChild(kpiCardItem('Active Brands', k.activeBrandCount.toLocaleString(), 'across portfolio'));

    var matSalesCard = kpiCardItem('MAT Sales', formatValue(k.matSales), '');
    if (k.yoyPct !== null) {
      var isUp = k.yoyPct >= 0;
      var delta = document.createElement('div');
      delta.className = 'kpi-card-delta ' + (isUp ? 'up' : 'down');
      delta.textContent = (isUp ? '▲ ' : '▼ ') + (isUp ? '+' : '') + k.yoyPct.toFixed(1) + '% vs Prior Period ' + formatValue(k.priorSales);
      matSalesCard.appendChild(delta);
    }
    $kpiCards.appendChild(matSalesCard);

    $kpiCards.appendChild(kpiCardItem('Portfolio OCR', k.ocrPct !== null ? k.ocrPct.toFixed(1) + '%' : '—', ''));
    $kpiCards.appendChild(kpiCardItem('Avg Sales/Sqm', k.avgSalesPerSqm !== null ? formatValue(k.avgSalesPerSqm) : '—', ''));
  }

  function kpiCardItem(label, value, sub) {
    var item = document.createElement('div');
    item.className = 'kpi-card-item';
    var lbl = document.createElement('div'); lbl.className = 'kpi-card-label'; lbl.textContent = label;
    var val = document.createElement('div'); val.className = 'kpi-card-value'; val.textContent = value;
    item.appendChild(lbl); item.appendChild(val);
    if (sub) {
      var subEl = document.createElement('div'); subEl.className = 'kpi-card-sub'; subEl.textContent = sub;
      item.appendChild(subEl);
    }
    return item;
  }

  // ── Group data ────────────────────────────────────────────────────────────
  function groupData(rows) {
    var fld = cfg.fieldMappings;
    var catMap = {}, catOrder = [];

    rows.forEach(function (row) {
      var catName = (fld.categoryField && row[fld.categoryField]) ? row[fld.categoryField] : '(No Category)';
      if (!catMap[catName]) {
        catMap[catName] = {
          name: catName,
          categorySqft:      fld.categorySqftField ? (row[fld.categorySqftField] || '') : '',
          categoryYoy:       fld.categoryYoyField  ? (row[fld.categoryYoyField]  || '') : '',
          tenantMap: {}, tenantOrder: [],
          leaseCodesSeen: {}, activeLeaseCount: 0,
          activeBrandCodesSeen: {}, activeTenantCount: 0,
        };
        catOrder.push(catName);
      }
      var cat = catMap[catName];
      var tenantRaw  = (fld.tenantField && row[fld.tenantField]) ? String(row[fld.tenantField]).trim() : '';
      var tenantName = tenantRaw || '(No Tenant)';
      var tenantKey  = tenantRaw ? normalizeTenantKey(tenantRaw) : '(NO TENANT)';
      // Roster rows are grouped by Brand Code (one brand can have many leases/Tenant Codes); tenant name is display-only.
      var brandKey = fld.brandCodeField ? normalizeTenantKey(row[fld.brandCodeField]) : tenantKey;
      if (!cat.tenantMap[brandKey]) {
        cat.tenantMap[brandKey] = {
          name:        tenantName,
          salesIndex:  fld.salesIndexField  ? (row[fld.salesIndexField]  || '') : '',
          tenantYoy:   fld.tenantYoyField   ? (row[fld.tenantYoyField]   || '') : '',
          ocr:         fld.ocrField         ? (row[fld.ocrField]         || '') : '',
          status:      fld.statusField      ? (row[fld.statusField]      || '') : '',
          salesPerSqm: fld.salesPerSqmField ? (row[fld.salesPerSqmField] || '') : '',
          storeCount:  fld.storeCountField  ? (row[fld.storeCountField]  || '') : '',
          salesCurrentPeriod: 0,
          stores: [],
        };
        cat.tenantOrder.push(brandKey);
      }
      // Sales — current period is a per-unit value, not duplicated per tenant, so it accumulates on every row.
      if (fld.salesCurrentPeriodField) {
        cat.tenantMap[brandKey].salesCurrentPeriod += parseNumeric(row[fld.salesCurrentPeriodField]) || 0;
      }
      // Active leases/tenants (Tenant Code / Brand Code, within category) only count rows with Tenant Status = Current.
      if (isActiveTenantStatus(fld, row)) {
        var leaseCode = fld.tenantCodeField ? normalizeTenantKey(row[fld.tenantCodeField]) : '';
        if (leaseCode) {
          if (!cat.leaseCodesSeen[leaseCode]) { cat.leaseCodesSeen[leaseCode] = true; cat.activeLeaseCount++; }
        } else {
          cat.activeLeaseCount++;
        }
        if (!cat.activeBrandCodesSeen[brandKey]) { cat.activeBrandCodesSeen[brandKey] = true; cat.activeTenantCount++; }
      }
      var loc = fld.locationField ? (row[fld.locationField] || '') : '';
      var lvl = fld.levelField    ? (row[fld.levelField]    || '') : '';
      cat.tenantMap[brandKey].stores.push({
        location:    lvl ? loc + ' · ' + lvl : loc,
        leaseEnd:    fld.leaseEndField    ? (row[fld.leaseEndField]    || '') : '',
        sqm:         fld.sqmField        ? (row[fld.sqmField]        || '') : '',
        leaseValue:  fld.leaseValueField  ? (row[fld.leaseValueField]  || '') : '',
        storeStatus: fld.storeStatusField ? (row[fld.storeStatusField] || '') : '',
      });
    });

    return catOrder.map(function (catName) {
      var cat = catMap[catName];
      var tenants = cat.tenantOrder.map(function (tn) { return cat.tenantMap[tn]; });
      if (activeSort) {
        tenants = tenants.slice().sort(function (a, b) {
          var av = parseNumeric(a[activeSort]); if (isNaN(av)) av = -Infinity;
          var bv = parseNumeric(b[activeSort]); if (isNaN(bv)) bv = -Infinity;
          return bv - av;
        });
      }
      return {
        name: cat.name,
        activeLeaseCount:  cat.activeLeaseCount,
        activeTenantCount: cat.activeTenantCount,
        categorySqft:      cat.categorySqft,
        categoryYoy:       cat.categoryYoy,
        tenants:           tenants,
      };
    });
  }

  // ── Filters ───────────────────────────────────────────────────────────────
  function initActiveFilters() {
    var fc = cfg.filterConfig || {};
    activeFilters = {};
    if (fc.dateFilter && fc.dateFilter.enabled) {
      activeFilters.date = { preset: fc.dateFilter.defaultPreset || 'all', from: '', to: '' };
    }
    (fc.filters || []).forEach(function (def) { activeFilters[def.id] = []; });
  }

  function applyFilters(rows) {
    var fc  = cfg.filterConfig || {};
    var fld = cfg.fieldMappings || {};
    var out = rows;
    if (fc.dateFilter && fc.dateFilter.enabled && activeFilters.date) {
      var colName = fld[fc.dateFilter.field];
      if (colName) out = applyDateFilter(out, colName, activeFilters.date.preset, activeFilters.date.from, activeFilters.date.to);
    }
    (fc.filters || []).forEach(function (def) {
      var sel = activeFilters[def.id];
      if (!sel || !sel.length) return;
      var colName = fld[def.field];
      if (!colName) return;
      out = out.filter(function (row) { return sel.indexOf(String(row[colName] || '')) >= 0; });
    });
    return out;
  }

  function applyDateFilter(rows, colName, preset, fromStr, toStr) {
    if (preset === 'all') return rows;
    var now = new Date();
    var fromDate, toDate;
    if (preset === 'custom') {
      fromDate = fromStr ? new Date(fromStr) : null;
      toDate   = toStr   ? new Date(toStr)   : null;
    } else {
      toDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      if      (preset === 'last7')  fromDate = new Date(+now - 7   * 864e5);
      else if (preset === 'last14') fromDate = new Date(+now - 14  * 864e5);
      else if (preset === 'last30') fromDate = new Date(+now - 30  * 864e5);
      else if (preset === 'last60') fromDate = new Date(+now - 60  * 864e5);
      else if (preset === 'last90') fromDate = new Date(+now - 90  * 864e5);
      else if (preset === 'mtd')    fromDate = new Date(now.getFullYear(), now.getMonth(), 1);
      else if (preset === 'qtd')    fromDate = new Date(now.getFullYear(), Math.floor(now.getMonth() / 3) * 3, 1);
      else if (preset === 'ytd')    fromDate = new Date(now.getFullYear(), 0, 1);
    }
    return rows.filter(function (row) {
      var d = new Date(row[colName]);
      if (isNaN(d)) return false;
      if (fromDate && d < fromDate) return false;
      if (toDate   && d > toDate)   return false;
      return true;
    });
  }

  function applyAndRender() {
    var filtered = applyFilters(rawRows);
    portfolioKpis = computePortfolioKpis(filtered);
    renderKpiCards(portfolioKpis);
    var grouped  = groupData(filtered);
    if (!grouped || grouped.length === 0) { showEmpty(); return; }
    showMainContent();
    renderMain(grouped);
  }

  // ── Filter bar ────────────────────────────────────────────────────────────
  function renderFilterBar() {
    var fc          = cfg.filterConfig || {};
    var hasDate     = fc.dateFilter && fc.dateFilter.enabled;
    var hasCats     = fc.filters && fc.filters.length > 0;
    var sortMetrics = SORT_METRICS.filter(function (m) { return !!cfg.fieldMappings[m.key]; });
    if (!hasDate && !hasCats && sortMetrics.length === 0) { $filterBar.style.display = 'none'; return; }

    closeDropdown();
    $filterBar.style.display = 'flex';
    $filterBar.innerHTML = '';

    var left = document.createElement('div');
    left.className = 'filter-bar-left';
    if (hasDate) left.appendChild(buildDatePill(fc.dateFilter));
    (fc.filters || []).forEach(function (def) { left.appendChild(buildCategoryPill(def)); });
    if (hasDate || hasCats) {
      var clearBtn = document.createElement('button');
      clearBtn.className = 'filter-clear-btn';
      clearBtn.innerHTML = '&#215; Clear all';
      clearBtn.addEventListener('click', function () { initActiveFilters(); renderFilterBar(); applyAndRender(); });
      left.appendChild(clearBtn);
    }
    $filterBar.appendChild(left);

    var right = document.createElement('div');
    right.className = 'filter-bar-right';
    sortMetrics.forEach(function (m) { right.appendChild(buildSortButton(m)); });
    $filterBar.appendChild(right);
  }

  function buildSortButton(metric) {
    var btn = document.createElement('button');
    btn.className = 'filter-pill' + (activeSort === metric.prop ? ' active' : '');
    btn.textContent = metric.label;
    btn.addEventListener('click', function () {
      activeSort = (activeSort === metric.prop) ? null : metric.prop;
      renderFilterBar();
      applyAndRender();
    });
    return btn;
  }

  function buildDatePill(dateConfig) {
    var pill = document.createElement('button');
    function getPreset() { return (activeFilters.date || {}).preset || 'all'; }
    function isActive()  { return getPreset() !== 'all'; }

    function refreshPill() {
      var pillLabel = (dateConfig && dateConfig.label) ? dateConfig.label : 'Date';
      var preset    = getPreset();
      var found     = null;
      for (var i = 0; i < DATE_PRESETS.length; i++) { if (DATE_PRESETS[i].key === preset) { found = DATE_PRESETS[i]; break; } }
      var presetLabel = found ? found.label : 'All Time';
      if (preset === 'custom' && activeFilters.date) {
        var f = activeFilters.date.from, t = activeFilters.date.to;
        if (f || t) presetLabel = (f || '…') + ' – ' + (t || '…');
      }
      while (pill.firstChild) pill.removeChild(pill.firstChild);
      var cal = document.createElement('span');
      cal.textContent = isActive() ? '📅 ' + pillLabel + ': ' + presetLabel : '📅 ' + pillLabel;
      pill.appendChild(cal);
      if (isActive()) {
        var clr = document.createElement('span');
        clr.className = 'pill-clear'; clr.textContent = '×';
        clr.addEventListener('click', function (ev) {
          ev.stopPropagation();
          activeFilters.date = { preset: 'all', from: '', to: '' };
          refreshPill(); applyAndRender();
        });
        pill.appendChild(clr);
      }
      var chev = document.createElement('span'); chev.className = 'pill-chevron'; chev.textContent = '▾';
      pill.appendChild(chev);
      pill.className = 'filter-pill' + (isActive() ? ' active' : '');
    }

    refreshPill();

    pill.addEventListener('click', function (e) {
      e.stopPropagation();
      if (currentDropdownEl && pill.classList.contains('open')) { closeDropdown(); return; }
      closeDropdown(); pill.classList.add('open');

      var dropdown = document.createElement('div'); dropdown.className = 'filter-dropdown';
      var body = document.createElement('div'); body.className = 'filter-dropdown-body';
      dropdown.appendChild(body);
      var customDiv = null;

      DATE_PRESETS.forEach(function (p) {
        var item = document.createElement('div');
        item.className = 'date-preset-item' + (getPreset() === p.key ? ' selected' : '');
        var dot = document.createElement('span'); dot.className = 'preset-dot'; dot.textContent = getPreset() === p.key ? '●' : '○'; item.appendChild(dot);
        var lbl = document.createElement('span'); lbl.textContent = p.label; item.appendChild(lbl);
        item.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (p.key === 'custom') {
            activeFilters.date = { preset: 'custom', from: (activeFilters.date || {}).from || '', to: (activeFilters.date || {}).to || '' };
            body.querySelectorAll('.date-preset-item').forEach(function (it) { it.querySelector('.preset-dot').textContent = '○'; it.classList.remove('selected'); });
            item.querySelector('.preset-dot').textContent = '●'; item.classList.add('selected');
            if (customDiv) customDiv.style.display = 'flex'; return;
          }
          activeFilters.date = { preset: p.key, from: '', to: '' };
          refreshPill(); closeDropdown(); pill.classList.remove('open'); applyAndRender();
        });
        body.appendChild(item);
        if (p.key === 'custom') {
          customDiv = document.createElement('div'); customDiv.className = 'date-custom-inputs';
          customDiv.style.display = getPreset() === 'custom' ? 'flex' : 'none';
          var fromRow = document.createElement('div'); fromRow.className = 'date-custom-row';
          var fromLbl = document.createElement('label'); fromLbl.textContent = 'From';
          var fromInp = document.createElement('input'); fromInp.type = 'date'; fromInp.value = (activeFilters.date || {}).from || '';
          fromRow.appendChild(fromLbl); fromRow.appendChild(fromInp);
          var toRow = document.createElement('div'); toRow.className = 'date-custom-row';
          var toLbl = document.createElement('label'); toLbl.textContent = 'To';
          var toInp = document.createElement('input'); toInp.type = 'date'; toInp.value = (activeFilters.date || {}).to || '';
          toRow.appendChild(toLbl); toRow.appendChild(toInp);
          var applyBtn = document.createElement('button'); applyBtn.className = 'date-apply-btn'; applyBtn.textContent = 'Apply';
          applyBtn.addEventListener('click', function (ev) {
            ev.stopPropagation();
            activeFilters.date = { preset: 'custom', from: fromInp.value, to: toInp.value };
            refreshPill(); closeDropdown(); pill.classList.remove('open'); applyAndRender();
          });
          customDiv.appendChild(fromRow); customDiv.appendChild(toRow); customDiv.appendChild(applyBtn);
          body.appendChild(customDiv);
        }
      });
      positionDropdown(dropdown, pill);
      document.body.appendChild(dropdown); currentDropdownEl = dropdown;
      setTimeout(function () { document.addEventListener('click', outsideClickHandler); }, 0);
    });
    return pill;
  }

  function buildCategoryPill(def) {
    var pill = document.createElement('button');
    function getSelected() { return activeFilters[def.id] || []; }
    function isActive()    { return getSelected().length > 0; }

    function refreshPill() {
      var sel = getSelected();
      while (pill.firstChild) pill.removeChild(pill.firstChild);
      var span = document.createElement('span'); span.textContent = def.label + (sel.length === 0 ? ': All' : ''); pill.appendChild(span);
      if (sel.length > 0) {
        var badge = document.createElement('span'); badge.className = 'pill-count'; badge.textContent = sel.length; pill.appendChild(badge);
        var clr = document.createElement('span'); clr.className = 'pill-clear'; clr.textContent = '×';
        clr.addEventListener('click', function (ev) { ev.stopPropagation(); activeFilters[def.id] = []; refreshPill(); applyAndRender(); });
        pill.appendChild(clr);
      }
      var chev = document.createElement('span'); chev.className = 'pill-chevron'; chev.textContent = '▾'; pill.appendChild(chev);
      pill.className = 'filter-pill' + (isActive() ? ' active' : '');
    }

    refreshPill();

    pill.addEventListener('click', function (e) {
      e.stopPropagation();
      if (currentDropdownEl && pill.classList.contains('open')) { closeDropdown(); return; }
      closeDropdown(); pill.classList.add('open');
      var fld     = cfg.fieldMappings || {};
      var colName = fld[def.field];
      var values  = colName ? getUniqueValues(colName) : [];
      var isMulti = def.type !== 'single';
      var dropdown = document.createElement('div'); dropdown.className = 'filter-dropdown';
      var body = document.createElement('div'); body.className = 'filter-dropdown-body'; dropdown.appendChild(body);
      if (values.length === 0) {
        var empty = document.createElement('div'); empty.className = 'filter-dropdown-item'; empty.style.color = 'var(--text-muted)'; empty.textContent = 'No values found'; body.appendChild(empty);
      } else {
        values.forEach(function (val) {
          var item = document.createElement('div'); item.className = 'filter-dropdown-item';
          var input = document.createElement('input'); input.type = isMulti ? 'checkbox' : 'radio'; input.name = 'fpill-' + def.id; input.value = val; input.checked = getSelected().indexOf(val) >= 0;
          var labelEl = document.createElement('span'); labelEl.textContent = val || '(blank)';
          input.addEventListener('change', function () {
            if (isMulti) {
              var cur = activeFilters[def.id] || [];
              activeFilters[def.id] = input.checked ? cur.concat([val]) : cur.filter(function (v) { return v !== val; });
            } else { activeFilters[def.id] = input.checked ? [val] : []; closeDropdown(); pill.classList.remove('open'); }
            refreshPill(); applyAndRender();
          });
          item.appendChild(input); item.appendChild(labelEl);
          item.addEventListener('click', function (ev) { if (ev.target !== input) input.click(); });
          body.appendChild(item);
        });
      }
      if (isMulti && values.length > 0) {
        var footer = document.createElement('div'); footer.className = 'filter-dropdown-footer';
        var selAll = document.createElement('button'); selAll.textContent = 'Select all';
        selAll.addEventListener('click', function (ev) { ev.stopPropagation(); activeFilters[def.id] = values.slice(); refreshPill(); applyAndRender(); closeDropdown(); });
        var clearF = document.createElement('button'); clearF.textContent = 'Clear';
        clearF.addEventListener('click', function (ev) { ev.stopPropagation(); activeFilters[def.id] = []; refreshPill(); applyAndRender(); closeDropdown(); });
        footer.appendChild(selAll); footer.appendChild(clearF); dropdown.appendChild(footer);
      }
      positionDropdown(dropdown, pill);
      document.body.appendChild(dropdown); currentDropdownEl = dropdown;
      setTimeout(function () { document.addEventListener('click', outsideClickHandler); }, 0);
    });
    return pill;
  }

  function getUniqueValues(colName) {
    var seen = {}, vals = [];
    rawRows.forEach(function (row) { var v = String(row[colName] || ''); if (!seen[v]) { seen[v] = true; vals.push(v); } });
    return vals.sort();
  }

  function positionDropdown(dropdown, pill) {
    var rect = pill.getBoundingClientRect();
    dropdown.style.top  = (rect.bottom + 6) + 'px';
    dropdown.style.left = rect.left + 'px';
  }

  function closeDropdown() {
    if (currentDropdownEl) { currentDropdownEl.remove(); currentDropdownEl = null; }
    document.removeEventListener('click', outsideClickHandler);
    if ($filterBar) $filterBar.querySelectorAll('.filter-pill.open').forEach(function (p) { p.classList.remove('open'); });
  }

  function outsideClickHandler(e) {
    if (currentDropdownEl && !currentDropdownEl.contains(e.target)) closeDropdown();
  }

  // ── Render ────────────────────────────────────────────────────────────────
  function showEmpty() {
    $kpiCards.style.display      = 'none';
    $dataCapNotice.style.display = 'none';
    $filterBar.style.display     = 'none';
    $main.style.display          = 'none';
    $emptyState.style.display    = 'flex';
  }

  function showMainContent() {
    $emptyState.style.display = 'none';
    $kpiCards.style.display   = 'flex';
    $main.style.display       = 'block';
  }

  function renderMain(groupedData) {
    $main.innerHTML = '';
    groupedData.forEach(function (cat) {
      var catBlock = document.createElement('div');
      catBlock.className = 'cat-block';
      renderCategoryRow(cat, catBlock);
      $main.appendChild(catBlock);
    });
  }

  function renderCategoryRow(cat, catBlock) {
    var catRow = document.createElement('div');
    catRow.className = 'cat-row';

    var chevron = document.createElement('span');
    chevron.className = 'cat-chevron';
    chevron.textContent = '›';
    catRow.appendChild(chevron);

    var nameWrap = document.createElement('div');
    nameWrap.className = 'cat-name-wrap';
    var nameEl = document.createElement('div');
    nameEl.className = 'cat-name';
    nameEl.textContent = cat.name;
    var subEl = document.createElement('div');
    subEl.className = 'cat-sub';
    var subParts = [];
    subParts.push(cat.activeLeaseCount + ' active ' + (cat.activeLeaseCount === 1 ? 'lease' : 'leases'));
    subParts.push(cat.activeTenantCount + ' tracked ' + (cat.activeTenantCount === 1 ? 'tenant' : 'tenants'));
    subEl.textContent = subParts.join(' · ');
    nameWrap.appendChild(nameEl);
    nameWrap.appendChild(subEl);
    catRow.appendChild(nameWrap);

    var kpisEl = document.createElement('div');
    kpisEl.className = 'cat-kpis';
    if (cat.categorySqft) kpisEl.appendChild(buildCatKpi('Sales / Sqm', cat.categorySqft, ''));
    if (cat.categoryYoy) {
      var yoyNum = parseNumeric(cat.categoryYoy);
      var yoyCls = isNaN(yoyNum) ? '' : (yoyNum >= 0 ? 'yoy-pos' : 'yoy-neg');
      kpisEl.appendChild(buildCatKpi('YoY Growth', cat.categoryYoy, yoyCls));
    }
    catRow.appendChild(kpisEl);

    var rosterBtn = document.createElement('button');
    rosterBtn.className = 'cat-roster-btn';
    rosterBtn.textContent = 'Show roster';
    catRow.appendChild(rosterBtn);
    catBlock.appendChild(catRow);

    var rosterWrap = document.createElement('div');
    rosterWrap.className = 'roster-wrap';
    rosterWrap.style.display = 'none';
    catBlock.appendChild(rosterWrap);

    var isOpen = !!openCategories[cat.name];
    function toggleRoster() {
      isOpen = !isOpen;
      openCategories[cat.name] = isOpen;
      chevron.classList.toggle('open', isOpen);
      rosterBtn.textContent = isOpen ? 'Hide roster' : 'Show roster';
      if (isOpen) {
        rosterWrap.innerHTML = '';
        renderRosterTable(cat, rosterWrap);
        rosterWrap.style.display = 'block';
      } else {
        rosterWrap.style.display = 'none';
      }
    }
    catRow.addEventListener('click', toggleRoster);
    rosterBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleRoster(); });

    if (isOpen) {
      chevron.classList.add('open');
      rosterBtn.textContent = 'Hide roster';
      renderRosterTable(cat, rosterWrap);
      rosterWrap.style.display = 'block';
    }
  }

  function buildCatKpi(label, value, valueClass) {
    var kpi = document.createElement('div');
    kpi.className = 'cat-kpi';
    var lbl = document.createElement('div'); lbl.className = 'cat-kpi-label'; lbl.textContent = label;
    var val = document.createElement('div'); val.className = 'cat-kpi-value' + (valueClass ? ' ' + valueClass : ''); val.textContent = value;
    kpi.appendChild(lbl); kpi.appendChild(val);
    return kpi;
  }

  function renderRosterTable(cat, container) {
    var fld = cfg.fieldMappings;
    var lbl = cfg.columnLabels;
    var vis = cfg.columnVisibility || {};
    var showSalesIndex   = vis.salesIndexVisible   !== false;
    var showYoy          = !!fld.tenantYoyField          && vis.yoyVisible          !== false;
    var showOcr          = !!fld.ocrField                && vis.ocrVisible          !== false;
    var showStatus       = !!fld.statusField             && vis.statusVisible       !== false;
    var showSalesCurrent = !!fld.salesCurrentPeriodField && vis.salesCurrentVisible !== false;
    var showSalesPerSqm  = !!fld.salesPerSqmField        && vis.salesPerSqmVisible  !== false;
    var showStores       = vis.storesVisible !== false;

    var table = document.createElement('table');
    table.className = 'roster-table';

    var thHtml = '<tr>' +
      '<th>' + esc(lbl.tenantLabel) + '</th>' +
      '<th>' + esc(lbl.locationLabel) + '</th>' +
      (showSalesIndex ? '<th>' + esc(lbl.salesIndexLabel) + '</th>' : '') +
      (showSalesCurrent ? '<th>' + esc(lbl.salesCurrentLabel) + '</th>' : '') +
      (showSalesPerSqm  ? '<th>' + esc(lbl.salesPerSqmLabel) + '</th>' : '') +
      (showYoy    ? '<th>' + esc(lbl.yoyLabel) + '</th>' : '') +
      (showOcr    ? '<th>' + esc(lbl.ocrLabel) + '</th>' : '') +
      (showStores ? '<th>' + esc(lbl.storesLabel) + '</th>' : '') +
      (showStatus ? '<th>' + esc(lbl.statusLabel) + '</th>' : '') +
      '</tr>';
    var thead = document.createElement('thead');
    thead.innerHTML = thHtml;
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    cat.tenants.forEach(function (tenant) {
      var tr = document.createElement('tr');
      var primaryLoc = tenant.stores.length > 0 ? tenant.stores[0].location : '';
      var siNum   = parseNumeric(tenant.salesIndex);
      var barPct  = isNaN(siNum) ? 0 : Math.min(siNum / BAR_SCALE * 100, 100);
      var barColor = getSalesIndexColor(siNum);
      var yoyNum  = parseNumeric(tenant.tenantYoy);
      var yoyCls  = isNaN(yoyNum) ? '' : (yoyNum >= 0 ? 'yoy-pos' : 'yoy-neg');

      var tdStatus = '';
      if (showStatus) {
        var statusHtml = '';
        if (tenant.status) {
          var sc = getStatusBadgeClass(tenant.status);
          statusHtml = sc
            ? '<span class="status-badge ' + sc + '">' + esc(tenant.status) + '</span>'
            : '<span class="status-badge generic">' + esc(tenant.status) + '</span>';
        }
        tdStatus = '<td>' + statusHtml + '</td>';
      }

      var tdSalesIndex = showSalesIndex
        ? '<td><div class="sales-bar-wrap">' +
            '<div class="sales-bar-track"><div class="sales-bar-fill" style="width:' + barPct.toFixed(1) + '%;background:' + barColor + ';"></div></div>' +
            '<span class="sales-index-num">' + (isNaN(siNum) ? '—' : Math.round(siNum)) + '</span>' +
          '</div></td>'
        : '';

      tr.innerHTML =
        '<td><span class="tenant-name-cell">' + esc(tenant.name) + '</span></td>' +
        '<td><span class="location-cell">' + esc(primaryLoc) + '</span></td>' +
        tdSalesIndex +
        (showSalesCurrent ? '<td>' + esc(formatValue(tenant.salesCurrentPeriod)) + '</td>' : '') +
        (showSalesPerSqm  ? '<td>' + esc(tenant.salesPerSqm || '—') + '</td>' : '') +
        (showYoy ? '<td><span class="' + (yoyCls || '') + '">' + esc(tenant.tenantYoy || '—') + '</span></td>' : '') +
        (showOcr ? '<td>' + esc(tenant.ocr || '—') + '</td>' : '') +
        (showStores ? '<td>' + esc(String(tenant.storeCount || tenant.stores.length)) + '</td>' : '') +
        tdStatus;

      tr.addEventListener('click', function () { openTenantModal(tenant); });
      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    container.appendChild(table);
  }

  function getSalesIndexColor(value) {
    var bands = (cfg.bands || []).slice().sort(function (a, b) { return b.threshold - a.threshold; });
    for (var i = 0; i < bands.length; i++) {
      if (!isNaN(value) && value >= bands[i].threshold) return bands[i].color;
    }
    return bands.length > 0 ? bands[bands.length - 1].color : '#C62828';
  }

  function getStatusBadgeClass(status) {
    var s = (status || '').toUpperCase().trim();
    if (s === 'WATCH')   return 'watch';
    if (s === 'AT RISK') return 'at-risk';
    return '';
  }

  // ── Tenant modal ──────────────────────────────────────────────────────────
  function openTenantModal(tenant) {
    var siNum   = parseNumeric(tenant.salesIndex);
    var yoyNum  = parseNumeric(tenant.tenantYoy);
    var yoyStyle = isNaN(yoyNum) ? '' : (yoyNum >= 0 ? 'color:#2E7D32' : 'color:var(--danger)');

    var kpiTiles = [
      kpiTile('Sales Index', isNaN(siNum) ? '—' : Math.round(siNum), 'vs portfolio 100', true),
      '<div class="kpi-tile"><div class="kpi-label">YOY GROWTH</div><div class="kpi-value"' + (yoyStyle ? ' style="' + yoyStyle + '"' : '') + '>' + esc(tenant.tenantYoy || '—') + '</div></div>',
      kpiTile('OCR', tenant.ocr || '—', ''),
      kpiTile('Stores', String(tenant.storeCount || tenant.stores.length), ''),
    ];
    if (cfg.fieldMappings.salesCurrentPeriodField) {
      kpiTiles.push(kpiTile('Sales (AED)', formatValue(tenant.salesCurrentPeriod), ''));
    }

    var storeListHtml = tenant.stores.map(function (store) {
      var storeStatusCls = (store.storeStatus || '').toLowerCase() === 'active' ? 'active' : 'inactive';
      var metaParts = [];
      if (store.leaseEnd) metaParts.push('Lease ends ' + store.leaseEnd);
      if (store.sqm)      metaParts.push(store.sqm + ' sqm');
      var valueHtml  = store.leaseValue ? '<span class="store-value-text">' + esc(formatValue(store.leaseValue)) + '</span>' : '';
      var statusHtml = store.storeStatus ? '<span class="store-status-badge ' + storeStatusCls + '">' + esc(store.storeStatus) + '</span>' : '';
      return '<div class="store-row">' +
        '<div class="store-info">' +
          '<div class="store-location-name">' + esc(store.location) + '</div>' +
          (metaParts.length ? '<div class="store-meta-text">' + esc(metaParts.join(' · ')) + '</div>' : '') +
        '</div>' +
        '<div class="store-right">' + valueHtml + statusHtml + '</div>' +
      '</div>';
    }).join('');

    $modalCard.innerHTML =
      '<div class="modal-head">' +
        '<div class="modal-eyebrow">Tenant</div>' +
        '<div class="modal-tenant-name">' + esc(tenant.name) + '</div>' +
        '<div class="modal-subtitle-text">Active tenant · performance profile across portfolio</div>' +
        '<button class="modal-close" id="modal-close-btn">×</button>' +
      '</div>' +
      '<div class="kpi-row" style="grid-template-columns:repeat(' + kpiTiles.length + ',1fr);">' +
        kpiTiles.join('') +
      '</div>' +
      '<div class="modal-section">' +
        '<div class="section-eyebrow">Store List</div>' +
        '<div class="section-heading">' + esc(tenant.name) + ' across our portfolio</div>' +
        (storeListHtml || '<p style="font-size:13px;color:var(--text-muted);">No store data available.</p>') +
      '</div>' +
      '<div class="modal-bottom"></div>';

    $modal.classList.add('open');
    document.getElementById('modal-close-btn').addEventListener('click', closeTenantModal);
    $modal.addEventListener('click', modalBackdropClick);
    document.addEventListener('keydown', modalEscHandler);
  }

  function kpiTile(label, value, sub, accent) {
    return '<div class="kpi-tile">' +
      '<div class="kpi-label">' + esc(label) + '</div>' +
      '<div class="kpi-value' + (accent ? ' accent' : '') + '">' + esc(String(value)) + '</div>' +
      (sub ? '<div class="kpi-sub">' + esc(sub) + '</div>' : '') +
    '</div>';
  }

  function closeTenantModal() {
    $modal.classList.remove('open');
    $modal.removeEventListener('click', modalBackdropClick);
    document.removeEventListener('keydown', modalEscHandler);
  }

  function modalBackdropClick(e) { if (e.target === $modal) closeTenantModal(); }
  function modalEscHandler(e)    { if (e.key === 'Escape') closeTenantModal(); }

  // Values come through as Tableau's formattedValue (e.g. "1,234", "AED 1,234", "12.4%"),
  // so plain parseFloat truncates at the first comma or fails outright on a currency prefix.
  function parseNumeric(raw) {
    if (raw === null || raw === undefined || raw === '') return NaN;
    var cleaned = String(raw).replace(/[^0-9.\-]/g, '');
    if (cleaned === '' || cleaned === '-' || cleaned === '.') return NaN;
    return parseFloat(cleaned);
  }

  // Collapses whitespace/case variants of the same tenant name ("Starbucks", " Starbucks ", "STARBUCKS")
  // so they aren't counted or grouped as distinct tenants.
  function normalizeTenantKey(name) {
    return String(name || '').trim().replace(/\s+/g, ' ').toUpperCase();
  }

  // Gates Active Leases / Active Brands / Tracked Tenants counting. No Tenant Status mapped => count everything.
  function isActiveTenantStatus(fld, row) {
    if (!fld.tenantStatusField) return true;
    return normalizeTenantKey(row[fld.tenantStatusField]) === 'CURRENT';
  }

  function formatValue(raw) {
    var n = parseNumeric(raw);
    if (isNaN(n)) return raw || '—';
    if (n >= 1e9) return 'AED ' + (n / 1e9).toFixed(1) + 'B';
    if (n >= 1e6) return 'AED ' + (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return 'AED ' + (n / 1e3).toFixed(0) + 'K';
    return 'AED ' + n.toLocaleString();
  }

      { Category:'Health & Beauty', 'Active Leases':'22', 'Cat Sales/SqFt':'AED 2,410', 'Cat YoY':'+2.8%', Tenant:'GNC',                'Sales Index':'79',  'Sales Current':'4740000', 'Tenant YoY':'-6.1%',  OCR:'13.4%',Status:'AT RISK',      Location:'World Trade Ctr', Level:'GF', 'Lease End':'Apr 2025', SQM:'80',  'Lease Value':'640,000',   'Store Status':'Inactive' },
    ];

    rawRows.forEach(function (row) {
      var sales = parseFloat(row['Sales Current']) || 0;
      var yoy   = parseFloat(row['Tenant YoY']) || 0;
      var ocr   = parseFloat(row.OCR) || 0;
      var sqm   = parseFloat(row.SQM) || 0;
      row['Sales Prior'] = String(Math.round(sales / (1 + yoy / 100)));
      row['MAT Rent']    = String(Math.round(sales * ocr / 100));
      row['Sales/Sqm']   = sqm ? (sales / sqm).toFixed(0) : '';
    });

    var storeCounts = {};
    rawRows.forEach(function (row) { storeCounts[row.Tenant] = (storeCounts[row.Tenant] || 0) + 1; });
    rawRows.forEach(function (row) { row['Store Count'] = String(storeCounts[row.Tenant]); });

    var brandCodes = {}, brandSeq = 1;
    rawRows.forEach(function (row, i) {
      if (!brandCodes[row.Tenant]) brandCodes[row.Tenant] = 'BR' + String(brandSeq++).padStart(3, '0');
      row['Brand Code']  = brandCodes[row.Tenant];
      row['Tenant Code'] = 'TC' + String(i + 1).padStart(4, '0');
      // Demo a couple of expired leases so the Tenant Status filter has something to exclude.
      row['Tenant Status'] = row.Status === 'AT RISK' ? 'Expired' : 'Current';
    });

    var mockBanner = document.createElement('div');
    mockBanner.style.cssText = 'background:#EDE9FE;border-bottom:1px solid #C4B5FD;padding:5px 20px;font-size:11px;font-weight:600;color:#6D28D9;flex-shrink:0;display:flex;align-items:center;gap:6px;';
    mockBanner.innerHTML = '&#9641; Mock data preview — open in Tableau Desktop for live data';
    document.getElementById('app').insertBefore(mockBanner, document.getElementById('header').nextSibling);

    checkDataCap();
    initActiveFilters();
    renderFilterBar();
    applyAndRender();
  }

  function esc(str) {
    if (str === null || str === undefined) return '';
    var d = document.createElement('div'); d.textContent = String(str); return d.innerHTML;
  }

})();
</script>
