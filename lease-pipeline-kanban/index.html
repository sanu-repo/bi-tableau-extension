<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lease Pipeline Kanban</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <!-- Settings gear (authoring mode only, fallback for flaky "Configure..." menu) -->
  <button class="settings-btn" id="settingsBtn" style="display:none;" title="Configure"></button>

  <!-- Empty state (shown before configuration) -->
  <div class="empty-state" id="emptyState">
    <div style="font-size:40px;">📋</div>
    <h2>Lease Pipeline Kanban</h2>
    <p>Configure this extension to map your worksheet fields to the Kanban board columns and cards.</p>
    <button id="emptyConfigBtn">Configure Extension</button>
  </div>

  <!-- Kanban Board -->
  <div class="board" id="board" style="display:none;"></div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal"></div>
  </div>

  <!-- Scripts -->
  <script src="lib/tableau.extensions.1.latest.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
