<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fit-out Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="js/tableau.extensions.1.latest.min.js"></script>
  <style>
    :root {
      --bg:             #F7F5F0;
      --surface:        #FFFFFF;
      --surface2:       #F0EDE8;
      --border:         #E8E4DD;
      --accent:         #D4782F;
      --text:           #1A1A1A;
      --text-secondary: #4A4A4A;
      --text-muted:     #6B6B6B;
      --danger:         #C62828;
      --green:          #1B7A3E;
      --radius:         8px;
      --font:           'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: var(--font); background: transparent; color: var(--text); overflow: hidden; }

    /* ── App shell ── */
    #app { display: flex; flex-direction: column; height: 100vh; position: relative; background: var(--bg); }

    /* ── Data cap notice ── */
    #data-cap-notice {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 16px; background: #FFFDE7;
      border-bottom: 1px solid #FFE082;
      font-size: 11px; font-weight: 500; color: #E65100; flex-shrink: 0;
    }

    /* ── Main view (shown when data loaded) ── */
    #main-view { display: none; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }

    /* ── Header ── */
    #ext-header { padding: 12px 16px 6px; flex-shrink: 0; }
    .ext-eyebrow { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin-bottom: 2px; }
    .ext-title { font-size: 15px; font-weight: 700; color: var(--text); }

    /* ── KPI row ── */
    #kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px 16px; flex-shrink: 0; }
    .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
    .kpi-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin-bottom: 4px; }
    .kpi-value { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1.1; }
    .kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .kpi-value.green { color: var(--green); }
    .kpi-value.red   { color: var(--danger); }

    /* ── Filter bar ── */
    #filter-bar {
      display: flex; align-items: center; flex-wrap: wrap;
      padding: 8px 16px; gap: 8px; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .filter-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 12px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 20px;
      font-size: 12px; font-weight: 500; color: var(--text-muted);
      cursor: pointer; user-select: none;
      transition: background .14s, border-color .14s, box-shadow .14s;
      white-space: nowrap; font-family: var(--font);
    }
    .filter-pill:hover { background: var(--surface2); border-color: #c5c0b9; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
    .filter-pill.active { background: rgba(212,120,47,.10); border-color: var(--accent); color: var(--text); }
    .filter-pill.open { box-shadow: 0 1px 6px rgba(0,0,0,.12); }
    .pill-chevron { font-size: 10px; color: var(--text-muted); }
    .filter-pill.active .pill-chevron { color: var(--accent); }
    .pill-clear { font-size: 14px; line-height: 1; color: var(--text-muted); padding: 0 2px; cursor: pointer; transition: color .12s; }
    .pill-clear:hover { color: var(--danger); }
    .pill-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; padding: 0 5px;
      background: var(--accent); color: #fff; border-radius: 9px;
      font-size: 10px; font-weight: 700;
    }
    .filter-clear-btn {
      margin-left: auto; display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 12px; background: transparent; border: 1px solid var(--border);
      border-radius: 20px; font-size: 12px; font-weight: 500; color: var(--text-muted);
      cursor: pointer; transition: color .14s, border-color .14s; font-family: var(--font);
    }
    .filter-clear-btn:hover { color: var(--danger); border-color: var(--danger); }
    .filter-dropdown {
      position: fixed; z-index: 200; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,.14);
      min-width: 200px; max-width: 260px; max-height: 320px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .filter-dropdown-body { overflow-y: auto; flex: 1; }
    .filter-dropdown-body::-webkit-scrollbar { width: 4px; }
    .filter-dropdown-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .filter-dropdown-item {
      display: flex; align-items: center; gap: 9px; padding: 9px 14px;
      font-size: 13px; color: var(--text); cursor: pointer; transition: background .1s;
    }
    .filter-dropdown-item:hover { background: var(--surface2); }
    .filter-dropdown-item input[type="checkbox"],
    .filter-dropdown-item input[type="radio"] { accent-color: var(--accent); width: 14px; height: 14px; flex-shrink: 0; cursor: pointer; }
    .filter-dropdown-footer { display: flex; justify-content: space-between; padding: 8px 14px; border-top: 1px solid var(--border); }
    .filter-dropdown-footer button { background: none; border: none; font-size: 12px; font-family: var(--font); color: var(--accent); cursor: pointer; padding: 2px 0; font-weight: 500; }
    .filter-dropdown-footer button:hover { text-decoration: underline; }
    .date-preset-item { display: flex; align-items: center; gap: 9px; padding: 9px 14px; font-size: 13px; color: var(--text); cursor: pointer; transition: background .1s; }
    .date-preset-item:hover { background: var(--surface2); }
    .date-preset-item.selected { font-weight: 600; color: var(--accent); }
    .preset-dot { font-size: 11px; flex-shrink: 0; color: var(--text-muted); }
    .date-preset-item.selected .preset-dot { color: var(--accent); }
    .date-custom-inputs { flex-direction: column; gap: 7px; padding: 10px 14px 8px; border-top: 1px solid var(--border); background: var(--surface2); }
    .date-custom-row { display: flex; align-items: center; gap: 8px; }
    .date-custom-row label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); width: 30px; flex-shrink: 0; }
    .date-custom-row input[type="date"] { flex: 1; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-family: var(--font); color: var(--text); background: var(--surface); outline: none; }
    .date-custom-row input[type="date"]:focus { border-color: var(--accent); }
    .date-apply-btn { padding: 6px 14px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 12px; font-family: var(--font); font-weight: 500; cursor: pointer; width: 100%; margin-top: 2px; }
    .date-apply-btn:hover { opacity: .88; }

    /* ── Table section ── */
    #table-section { flex: 1; overflow: auto; padding: 0 16px 16px; min-height: 0; }
    #table-section::-webkit-scrollbar { width: 6px; height: 6px; }
    #table-section::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    #fitout-table { width: 100%; border-collapse: collapse; }
    #fitout-table thead th {
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em;
      color: var(--text-muted); text-align: left; padding: 10px 10px 8px;
      border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0;
      background: var(--bg);
    }
    #fitout-table tbody tr { cursor: pointer; border-bottom: 1px solid var(--border); transition: background .1s; }
    #fitout-table tbody tr:hover { background: var(--surface); }
    #fitout-table tbody td { padding: 13px 10px; font-size: 13px; color: var(--text); vertical-align: middle; }
    .td-tenant { font-weight: 600; }
    .td-days { font-weight: 500; }
    .td-days.urgent { color: var(--danger); font-weight: 600; }

    /* ── Progress bar ── */
    .progress-cell { display: flex; align-items: center; gap: 8px; }
    .progress-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; min-width: 70px; max-width: 110px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; }
    .progress-fill.on-track { background: var(--green); }
    .progress-fill.at-risk  { background: var(--danger); }
    .progress-pct { font-size: 12px; font-weight: 500; color: var(--text-muted); min-width: 34px; }

    /* ── Status badge ── */
    .status-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
    .status-badge.on-track { background: #E8F5E9; color: var(--green); border: 1px solid #A5D6A7; }
    .status-badge.at-risk  { background: #FFEBEE; color: var(--danger); border: 1px solid #FFCDD2; }

    /* ── Centered modal ── */
    #tenant-modal {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.35); backdrop-filter: blur(5px);
      align-items: center; justify-content: center; padding: 20px;
    }
    #tenant-modal.open { display: flex; }
    #modal-inner {
      background: var(--surface); border-radius: 12px;
      max-width: 560px; width: 100%; max-height: 88vh; overflow-y: auto;
      box-shadow: 0 8px 48px rgba(0,0,0,.22);
    }
    #modal-inner::-webkit-scrollbar { width: 5px; }
    #modal-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Modal header */
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 20px 14px; border-bottom: 1px solid var(--border); }
    .modal-header h2 { font-size: 18px; font-weight: 700; color: var(--text); }
    .modal-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
    .modal-close { background: none; border: none; font-size: 22px; color: var(--text-muted); cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0; margin-left: 12px; }
    .modal-close:hover { color: var(--text); }

    /* Modal mini-KPIs */
    .modal-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--border); gap: 1px; }
    .modal-kpi-cell { background: var(--surface2); padding: 14px 12px; text-align: center; }
    .modal-kpi-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin-bottom: 5px; }
    .modal-kpi-val { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.1; }
    .modal-kpi-val.green { color: var(--green); }
    .modal-kpi-val.red   { color: var(--danger); }
    .modal-kpi-val.on-track-text { font-size: 14px; font-weight: 600; color: var(--green); }
    .modal-kpi-val.at-risk-text  { font-size: 14px; font-weight: 600; color: var(--danger); }
    .modal-kpi-val.owner { font-size: 14px; font-weight: 600; }
    .modal-kpi-date { font-size: 10px; color: var(--text-muted); margin-top: 3px; }

    /* Modal milestones */
    .modal-body { padding: 16px 20px 22px; }
    .modal-section-eyebrow { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); }
    .modal-section-title { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 2px; margin-bottom: 14px; }
    .milestone-list { display: flex; flex-direction: column; }
    .milestone-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .milestone-row:last-child { border-bottom: none; }
    .milestone-icon { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .milestone-icon.done    { background: var(--green); }
    .milestone-icon.pending { background: var(--surface2); border: 2px solid var(--border); }
    .milestone-name { flex: 1; font-size: 13px; color: var(--text); }
    .milestone-date { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .milestone-pending-label { font-size: 12px; color: var(--text-muted); font-style: italic; white-space: nowrap; }

    /* ── Gear button ── */
    #gear-btn {
      position: fixed; top: 8px; right: 8px; z-index: 50;
      width: 30px; height: 30px; border-radius: 6px;
      background: rgba(255,255,255,0.92); border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .14s ease, color .14s, border-color .14s;
    }
    #app:hover #gear-btn      { opacity: 1; }
    #gear-btn:hover           { color: var(--accent); border-color: var(--accent); }

    /* ── Empty state ── */
    #empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 10px; color: var(--text-muted); text-align: center; padding: 32px;
    }
    #empty-state h2 { font-size: 16px; color: var(--text); }
    #empty-state p  { font-size: 14px; max-width: 300px; line-height: 1.5; }
    #empty-state button {
      margin-top: 6px; padding: 8px 20px; background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius);
      font-size: 14px; font-family: var(--font); font-weight: 500; cursor: pointer;
    }
    #empty-state button:hover { opacity: .88; }
  </style>
</head>
<body>
<div id="app">

  <div id="data-cap-notice" style="display:none;"></div>

  <div id="main-view">
    <div id="ext-header">
      <div class="ext-eyebrow">✦ FIT-OUT TRACKER</div>
      <div class="ext-title">Active deliveries vs rent-start dates</div>
    </div>

    <div id="kpi-row">
      <div class="kpi-card">
        <div class="kpi-label">Active Fit-Outs</div>
        <div class="kpi-value" id="kpi-active">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">On Track</div>
        <div class="kpi-value green" id="kpi-on-track">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">At Risk</div>
        <div class="kpi-value red" id="kpi-at-risk">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">GLA</div>
        <div class="kpi-value" id="kpi-gla">—</div>
        <!-- TODO: implement GLA aggregation -->
      </div>
    </div>

    <div id="filter-bar" style="display:none;"></div>

    <div id="table-section">
      <table id="fitout-table">
        <thead>
          <tr>
            <th>Tenant</th>
            <th>Asset / Location</th>
            <th>Rent-Start</th>
            <th>Days Left</th>
            <th>Build Progress</th>
            <th>Manager</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="fitout-tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="empty-state">
    <h2>Fit-out Pipeline</h2>
    <p>Configure the extension to map your worksheet fields and stage order.</p>
    <button id="empty-config-btn">Configure Extension</button>
  </div>

  <div id="tenant-modal">
    <div id="modal-inner"></div>
  </div>

  <button id="gear-btn" title="Configure" aria-label="Configure" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

</div>
<script src="js/app.js"></script>
</body>
</html>
