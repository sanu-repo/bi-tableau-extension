<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARM Value Chain - Renewals &amp; Termination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="tableau.extensions.1.latest.min.js"></script>
  <style>
    :root {
      --bg:             #F7F5F0;
      --surface:        #FFFFFF;
      --surface2:       #F0EDE8;
      --border:         #E8E4DD;
      --accent:         #D4782F;
      --text:           #1A1A1A;
      --text-secondary: #4A4A4A;
      --text-muted:     #6B6B6B;
      --danger:         #C62828;
      --success:        #2E7D32;
      --landlord:       #1565C0;
      --landlord-bg:    #E3F2FD;
      --tenant-bg:      rgba(212,120,47,0.12);
      --radius:         8px;
      --font:           'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: var(--font); background: transparent; color: var(--text); overflow: hidden; }

    #app { display: flex; flex-direction: column; height: 100vh; position: relative; overflow: hidden; }

    /* ── Data cap notice ── */
    #data-cap-notice {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 16px; background: #FFFDE7;
      border-bottom: 1px solid #FFE082;
      font-size: 11px; font-weight: 500; color: #E65100; flex-shrink: 0;
    }

    /* ── Filter bar ── */
    #filter-bar {
      display: flex; align-items: center;
      padding: 8px 16px; gap: 8px; flex-shrink: 0; flex-wrap: wrap;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }

    /* ── Main area ── */
    #main { flex: 1; padding: 14px 16px; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; }

    /* ── KPI grid ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; flex-shrink: 0; }
    .kpi-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px;
    }
    .kpi-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-muted); margin-bottom: 8px;
    }
    .kpi-count { font-size: 34px; font-weight: 700; line-height: 1; margin-bottom: 6px; }
    .kpi-count.neutral { color: var(--text); }
    .kpi-count.accent  { color: var(--accent); }
    .kpi-count.success { color: var(--success); }
    .kpi-count.danger  { color: var(--danger); }
    .kpi-sub { font-size: 12px; color: var(--text-muted); }
    .kpi-card { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .kpi-card:hover:not(.active) { border-color: #c9c2b8; }
    .kpi-card.active { border-color: var(--accent); box-shadow: inset 0 -3px 0 0 var(--accent); }
    .kpi-card.active .kpi-label { color: var(--accent); }

    /* ── Bottom section ── */
    .bottom-section { display: grid; grid-template-columns: 1fr 320px; gap: 14px; flex: 1; min-height: 0; }

    /* ── Exits panel ── */
    .exits-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .panel-header-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-muted); margin-bottom: 3px;
    }
    .panel-header h3 { font-size: 14px; font-weight: 700; color: var(--text); }
    .exits-table-wrap { overflow-y: auto; flex: 1; }
    .exits-table-wrap::-webkit-scrollbar { width: 4px; }
    .exits-table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .exits-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .exits-table th {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: var(--text);
      padding: 8px 12px; text-align: left;
      border-bottom: 1px solid var(--border);
      background: var(--surface2); position: sticky; top: 0; z-index: 1;
    }
    .exits-table th.sortable-th { cursor: pointer; user-select: none; }
    .exits-table th.sortable-th:hover { color: var(--accent); }
    .sort-arrow { font-size: 8px; color: var(--accent); }
    .exits-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
    .exits-table tr:last-child td { border-bottom: none; }
    .exits-table tr:hover td { background: var(--surface2); }
    .col-tenant { font-weight: 600; }
    .col-date   { white-space: nowrap; color: var(--text-secondary); }
    .col-acv    { white-space: nowrap; font-weight: 500; }
    .col-rem    { white-space: nowrap; font-weight: 500; }
    .col-rem.urgent { color: var(--danger); }
    .col-rem.soon   { color: var(--accent); }
    .source-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 10px; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; white-space: nowrap;
    }
    .source-badge.landlord { background: var(--landlord-bg); color: var(--landlord); }
    .source-badge.tenant   { background: var(--tenant-bg); color: var(--accent); }
    .source-badge.other    { background: var(--surface2); color: var(--text-muted); }

    /* ── Donut panel ── */
    .donut-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden;
    }
    .donut-panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .donut-panel-header .panel-header-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-muted); margin-bottom: 3px;
    }
    .donut-panel-header h3 { font-size: 14px; font-weight: 700; color: var(--text); }
    .donut-chart-wrap { display: flex; align-items: center; justify-content: center; padding: 20px 16px 12px; }
    .donut-legend { padding: 0 16px 12px; }
    .donut-legend-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid var(--border);
      font-size: 13px; color: var(--text);
    }
    .donut-legend-item:last-child { border-bottom: none; }
    .legend-label { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
    .legend-count { font-weight: 600; }
    .donut-insight {
      padding: 10px 16px; border-top: 1px solid var(--border);
      font-size: 11px; color: var(--text-muted); line-height: 1.5;
      margin-top: auto;
    }

    /* ── Empty state ── */
    #empty-state {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 10px; color: var(--text-muted); text-align: center; padding: 32px;
    }
    #empty-state h2 { font-size: 16px; color: var(--text); }
    #empty-state p  { font-size: 14px; max-width: 300px; line-height: 1.5; }
    #empty-state button {
      margin-top: 6px; padding: 8px 20px; background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius);
      font-size: 14px; font-family: var(--font); font-weight: 500; cursor: pointer;
    }
    #empty-state button:hover { opacity: .88; }

    /* ── Gear button ── */
    #gear-btn {
      position: fixed; top: 8px; right: 8px; z-index: 50;
      width: 30px; height: 30px; border-radius: 6px;
      background: rgba(255,255,255,0.92); border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .14s ease, color .14s, border-color .14s;
    }
    #app:hover #gear-btn      { opacity: 1; }
    #gear-btn:hover           { color: var(--accent); border-color: var(--accent); }

    /* ── Filter pill styles ── */
    .filter-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 12px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 20px;
      font-size: 12px; font-weight: 500; color: var(--text-muted);
      cursor: pointer; user-select: none;
      transition: background .14s, border-color .14s, box-shadow .14s;
      white-space: nowrap; font-family: var(--font);
    }
    .filter-pill:hover { background: var(--surface2); border-color: #c5c0b9; }
    .filter-pill.active { background: rgba(212,120,47,.10); border-color: var(--accent); color: var(--text); }
    .pill-chevron { font-size: 10px; color: var(--text-muted); }
    .filter-pill.active .pill-chevron { color: var(--accent); }
    .pill-clear { font-size: 14px; line-height: 1; color: var(--text-muted); padding: 0 2px; cursor: pointer; }
    .pill-clear:hover { color: var(--danger); }
    .pill-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 17px; height: 17px; padding: 0 4px;
      background: var(--accent); color: #fff; border-radius: 9px;
      font-size: 10px; font-weight: 700;
    }
    .filter-clear-btn {
      margin-left: auto; display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; background: transparent; border: 1px solid var(--border);
      border-radius: 20px; font-size: 12px; font-weight: 500; color: var(--text-muted);
      cursor: pointer; font-family: var(--font); white-space: nowrap;
    }
    .filter-clear-btn:hover { color: var(--danger); border-color: var(--danger); }
    .filter-dropdown {
      position: fixed; z-index: 200; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,.14);
      min-width: 190px; max-width: 250px; max-height: 300px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .filter-dropdown-body { overflow-y: auto; flex: 1; }
    .filter-dropdown-body::-webkit-scrollbar { width: 4px; }
    .filter-dropdown-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .filter-dropdown-item {
      display: flex; align-items: center; gap: 9px; padding: 8px 14px;
      font-size: 13px; color: var(--text); cursor: pointer;
    }
    .filter-dropdown-item:hover { background: var(--surface2); }
    .filter-dropdown-item input[type="checkbox"],
    .filter-dropdown-item input[type="radio"] {
      accent-color: var(--accent); width: 14px; height: 14px; flex-shrink: 0; cursor: pointer;
    }
    .filter-dropdown-footer {
      display: flex; justify-content: space-between;
      padding: 7px 14px; border-top: 1px solid var(--border);
    }
    .filter-dropdown-footer button {
      background: none; border: none; font-size: 12px; font-family: var(--font);
      color: var(--accent); cursor: pointer; font-weight: 500;
    }
    .filter-dropdown-footer button:hover { text-decoration: underline; }
    .date-preset-item {
      display: flex; align-items: center; gap: 9px; padding: 8px 14px;
      font-size: 13px; color: var(--text); cursor: pointer;
    }
    .date-preset-item:hover { background: var(--surface2); }
    .date-preset-item.selected { font-weight: 600; color: var(--accent); }
    .preset-dot { font-size: 10px; color: var(--text-muted); flex-shrink: 0; }
    .date-preset-item.selected .preset-dot { color: var(--accent); }
    .date-custom-inputs {
      flex-direction: column; gap: 7px;
      padding: 10px 14px 8px; border-top: 1px solid var(--border); background: var(--surface2);
    }
    .date-custom-row { display: flex; align-items: center; gap: 8px; }
    .date-custom-row label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .05em; color: var(--text-muted); width: 30px; flex-shrink: 0;
    }
    .date-custom-row input[type="date"] {
      flex: 1; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; font-family: var(--font); color: var(--text);
      background: var(--surface); outline: none;
    }
    .date-custom-row input[type="date"]:focus { border-color: var(--accent); }
    .date-apply-btn {
      padding: 6px 14px; background: var(--accent); color: #fff; border: none;
      border-radius: 6px; font-size: 12px; font-family: var(--font);
      font-weight: 500; cursor: pointer; width: 100%; margin-top: 2px;
    }
    .date-apply-btn:hover { opacity: .88; }
  </style>
</head>
<body>
<div id="app">

  <div id="data-cap-notice" style="display:none;"></div>
  <div id="filter-bar" style="display:none;"></div>

  <div id="main" style="display:none;">
    <div class="kpi-grid" id="kpi-grid" role="tablist"></div>
    <div class="bottom-section">
      <div class="exits-panel">
        <div class="panel-header">
          <div class="panel-header-label" id="exits-panel-label"></div>
          <h3 id="exits-subtitle"></h3>
        </div>
        <div class="exits-table-wrap">
          <table class="exits-table">
            <thead id="exits-thead"></thead>
            <tbody id="exits-tbody"></tbody>
          </table>
        </div>
      </div>
      <div class="donut-panel">
        <div class="donut-panel-header">
          <div class="panel-header-label">Exit Split</div>
          <h3>By initiator</h3>
        </div>
        <div class="donut-chart-wrap" id="donut-svg-wrap"></div>
        <div class="donut-legend">
          <div class="donut-legend-item">
            <span class="legend-label">
              <span class="legend-dot" style="background:#F59E0B;"></span>
              Tenant-initiated
            </span>
            <span class="legend-count" id="donut-tenant-count">0</span>
          </div>
          <div class="donut-legend-item">
            <span class="legend-label">
              <span class="legend-dot" style="background:#1976D2;"></span>
              Landlord-initiated
            </span>
            <span class="legend-count" id="donut-landlord-count">0</span>
          </div>
        </div>
        <div class="donut-insight" id="donut-insight"></div>
      </div>
    </div>
  </div>

  <div id="empty-state">
    <h2>ARM Value Chain — Renewals &amp; Termination</h2>
    <p id="empty-state-msg">Configure the extension to connect a worksheet and map your fields.</p>
    <button id="empty-config-btn">Configure Extension</button>
  </div>

  <button id="gear-btn" title="Configure" aria-label="Configure" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>

    </svg>
  </button>

</div>

      { 'Lease Code': 'LC-E07', Tenant: 'Aldo',             Asset: 'Al Jimi Mall',       'Exit Date': '2027-01-05', ACV: '890000',  Source: 'Landlord-initiated', Reason: 'Tenant mix optimisation'  },
      { 'Lease Code': 'LC-E08', Tenant: 'Mothercare',       Asset: 'World Trade Center', 'Exit Date': '2026-12-15', ACV: '1560000', Source: 'Tenant-initiated',   Reason: 'Global restructuring'     },
    ],
  ];

  function renderMockPreview() {
    cfg      = MOCK_CFG;
    tileRows = MOCK_TILE_ROWS.slice();
    activeTileIndex = 0;
    rawRows  = tileRows[activeTileIndex] || [];
    $dataCapNotice.style.display = 'none';
    initActiveFilters();
    renderFilterBar();
    applyAndRender();
  }

  var cfg = {
    tiles: [
      { label: '', color: 'neutral', worksheet: '', leaseCodeField: '', acvField: '', columns: [] },
      { label: '', color: 'accent',  worksheet: '', leaseCodeField: '', acvField: '', columns: [] },
      { label: '', color: 'success', worksheet: '', leaseCodeField: '', acvField: '', columns: [] },
      { label: '', color: 'danger',  worksheet: '', leaseCodeField: '', acvField: '', columns: [] },
    ],
    filterConfig:  { tiles: [{}, {}, {}, {}] },
    displayConfig: null,
  };

  // ── Settings migration (old fixed-field schema → flexible per-tile columns) ─

  function migrateSettings(rawTiles, rawFilterConfig) {
    var migratedTiles = (rawTiles || []).map(function (tile) {
      tile = tile || {};
      var hasLegacyFields = tile.tenantField || tile.assetField || tile.exitDateField ||
                             tile.sourceField || tile.reasonField;
      if ((!tile.columns || !tile.columns.length) && hasLegacyFields) {
        var cols = [];
        if (tile.tenantField)   cols.push({ label: 'Tenant', field: tile.tenantField,   type: 'text' });
        if (tile.assetField)    cols.push({ label: 'Asset',  field: tile.assetField,    type: 'text' });
        if (tile.exitDateField) cols.push({ label: 'Date',   field: tile.exitDateField, type: 'date', remaining: true });
        if (tile.sourceField)   cols.push({ label: 'Source', field: tile.sourceField,   type: 'source' });
        if (tile.reasonField)   cols.push({ label: 'Reason', field: tile.reasonField,   type: 'text' });
        tile.columns = cols;
      } else if (!tile.columns) {
        tile.columns = [];
      }
      return tile;
    });
    while (migratedTiles.length < 4) {
      migratedTiles.push({ label: '', color: 'neutral', worksheet: '', leaseCodeField: '', acvField: '', columns: [] });
    }

    var fc = rawFilterConfig || {};
    if (!fc.tiles) {
      var newFcTiles = [0, 1, 2, 3].map(function () {
        return {
          dateFilter: { enabled: false, label: 'Date', defaultPreset: 'all' },
          categoryFilters: [ { enabled: false, columnIndex: -1 }, { enabled: false, columnIndex: -1 } ],
        };
      });
      if (fc.dateFilter || fc.assetFilter || fc.tenantFilter) {
        var legacyCols = (migratedTiles[3] || {}).columns || [];
        var findIdx = function (label) {
          for (var i = 0; i < legacyCols.length; i++) { if (legacyCols[i].label === label) return i; }
          return -1;
        };
        newFcTiles[3] = {
          dateFilter: {
            enabled:       !!(fc.dateFilter && fc.dateFilter.enabled),
            label:         (fc.dateFilter && fc.dateFilter.label) || 'Date',
            defaultPreset: (fc.dateFilter && fc.dateFilter.defaultPreset) || 'all',
          },
          categoryFilters: [
            { enabled: !!(fc.assetFilter  && fc.assetFilter.enabled),  columnIndex: findIdx('Asset')  },
            { enabled: !!(fc.tenantFilter && fc.tenantFilter.enabled), columnIndex: findIdx('Tenant') },
          ],
        };
      }
      fc.tiles = newFcTiles;
    }

    return { tiles: migratedTiles, filterConfig: fc };
  }

  // ── Init ───────────────────────────────────────────────────────────────────

  function initTableau() {
    if (typeof tableau === 'undefined' || !tableau.extensions) {
      console.warn('Tableau library not loaded — showing mock preview.');
      renderMockPreview();
      return;
    }
    tableau.extensions.initializeAsync({ configure: openConfig }).then(function () {
      tableauReady = true;

      var mode = tableau.extensions.environment.mode;
      var $emptyConfigBtn = document.getElementById('empty-config-btn');
      var $emptyConfigMsg = document.getElementById('empty-state-msg');
      if (mode === 'authoring') {
        $gearBtn.hidden = false;
        $gearBtn.addEventListener('click', openConfig);
        $emptyConfigBtn.addEventListener('click', openConfig);
      } else {
        $emptyConfigBtn.style.display = 'none';
        $emptyConfigMsg.textContent = 'This extension has not been configured yet. Contact your dashboard author.';
      }

      tableau.extensions.settings.addEventListener(
        tableau.TableauEventType.SettingsChanged,
        function () { loadSavedConfig(); fetchAndRender(); }
      );

      loadSavedConfig();
      fetchAndRender();
    }).catch(function (err) {
      console.warn('Tableau not available — showing mock preview:', err);
      renderMockPreview();
    });
  }

  function loadSavedConfig() {
    try {
      var all = tableau.extensions.settings.getAll();
      if (all.sourceWorksheet && !all.tiles) return; // old format — force reconfiguration
      var rawTiles        = all.tiles        ? JSON.parse(all.tiles)        : cfg.tiles;
      var rawFilterConfig = all.filterConfig  ? JSON.parse(all.filterConfig) : null;
      var migrated = migrateSettings(rawTiles, rawFilterConfig);
      cfg.tiles        = migrated.tiles;
      cfg.filterConfig = migrated.filterConfig;
      if (all.displayConfig) cfg.displayConfig = JSON.parse(all.displayConfig);
    } catch (e) {}
  }

  function openConfig() {
    if (!tableauReady) return;
    if (!tableau.extensions.environment || tableau.extensions.environment.mode !== 'authoring') return;
    var url = window.location.href.replace(/\/[^\/]*$/, '/dialog.html');
    tableau.extensions.ui.displayDialogAsync(url, '', { height: 680, width: 620 })
      .then(function (result) {
        if (result === 'saved') { loadSavedConfig(); fetchAndRender(); }
      })
      .catch(function (err) {
        if (err.errorCode !== tableau.ErrorCodes.DialogClosedByUser) {
          console.error('Dialog error:', err);
        }
      });
  }

  // ── Data ───────────────────────────────────────────────────────────────────

  function fetchAndRender() {
    if (cfg.tiles.every(function (t) { return !t.worksheet; })) { showEmpty(); return; }
    var dashboard = tableau.extensions.dashboardContent.dashboard;
    var promises = cfg.tiles.map(function (tile) {
      if (!tile.worksheet) return Promise.resolve([]);
      var ws = dashboard.worksheets.find(function (w) { return w.name === tile.worksheet; });
      if (!ws) return Promise.resolve([]);
      return ws.getSummaryDataAsync({ maxRows: MAX_ROWS })
        .then(function (dt) { return parseDataTable(dt); })
        .catch(function () { return []; });
    });
    Promise.all(promises).then(function (results) {
      tileRows = results;
      rawRows  = tileRows[activeTileIndex] || [];
      checkDataCap(tileRows[activeTileIndex] || []);
      initActiveFilters();
      renderFilterBar();
      applyAndRender();
    });
  }

  function parseDataTable(dt) {
    var cols = dt.columns.map(function (c) { return c.fieldName; });
    return dt.data.map(function (row) {
      var obj = {};
      cols.forEach(function (col, i) { obj[col] = row[i].value; });
      return obj;
    });
  }

  function checkDataCap(exitsRows) {
    if (exitsRows.length >= MAX_ROWS) {
      $dataCapNotice.style.display = 'flex';
      $dataCapNotice.innerHTML =
        '⚠ Showing top ' + MAX_ROWS.toLocaleString() +
        ' records — data has been capped. Apply a filter on the source worksheet to narrow the dataset.';
    } else {
      $dataCapNotice.style.display = 'none';
    }
  }

  function applyAndRender() {
    $emptyState.style.display = 'none';
    $main.style.display       = 'flex';
    renderMain();
  }

  // ── Render ─────────────────────────────────────────────────────────────────

  function renderMain() {
    rawRows = tileRows[activeTileIndex] || [];
    var filteredExits = applyFilters(rawRows);
    renderKPIs(tileRows);
    renderExitsTable(filteredExits);
    renderDonut(filteredExits);
    applyDisplayConfig();
  }

  function setActiveTile(idx) {
    if (idx === activeTileIndex) return;
    activeTileIndex = idx;
    rawRows = tileRows[activeTileIndex] || [];
    var tile = cfg.tiles[activeTileIndex] || {};
    exitsSort = { key: findRemainingColumn(tile) ? 'remaining' : 'col0', dir: 'asc' };
    initActiveFilters();
    renderFilterBar();
    renderMain();
  }

  function findColumnByType(tile, type) {
    var cols = (tile && tile.columns) || [];
    for (var i = 0; i < cols.length; i++) {
      if (cols[i].type === type) return cols[i];
    }
    return null;
  }

  function findRemainingColumn(tile) {
    var cols = (tile && tile.columns) || [];
    for (var i = 0; i < cols.length; i++) {
      if (cols[i].type === 'date' && cols[i].remaining) return cols[i];
    }
    return null;
  }

  function applyDisplayConfig() {
    var dc = cfg.displayConfig || {};
    var activeTile = cfg.tiles[activeTileIndex] || {};
    var showSplit  = dc.showExitSplit !== false && !!findColumnByType(activeTile, 'source');
    var donutEl  = document.querySelector('.donut-panel');
    var bottomEl = document.querySelector('.bottom-section');
    if (donutEl)  donutEl.style.display = showSplit ? '' : 'none';
    if (bottomEl) bottomEl.style.gridTemplateColumns = showSplit ? '1fr 320px' : '1fr';
  }

  function renderKPIs(allTileRows) {
    var $grid = document.getElementById('kpi-grid');
    $grid.innerHTML = '';

    (cfg.tiles || []).forEach(function (tile, i) {
      var rows     = allTileRows[i] || [];
      var count    = rows.length;
      var acvFld   = tile.acvField;
      var totalACV = rows.reduce(function (sum, r) {
        return sum + (parseFloat(r[acvFld]) || 0);
      }, 0);

      var subtitle = formatACV(totalACV);

      var srcCol = findColumnByType(tile, 'source');
      if (srcCol) {
        var llCount = 0, tlCount = 0;
        rows.forEach(function (r) {
          var src = String(r[srcCol.field] || '').toLowerCase();
          if (src.indexOf('landlord') >= 0) llCount++;
          else if (src.indexOf('tenant') >= 0) tlCount++;
        });
        subtitle += ' · ' + llCount + 'LL / ' + tlCount + 'T';
      }

      var card = document.createElement('div');
      card.className = 'kpi-card' + (i === activeTileIndex ? ' active' : '');
      card.setAttribute('role', 'tab');
      card.setAttribute('aria-selected', i === activeTileIndex ? 'true' : 'false');
      card.tabIndex = 0;
      card.innerHTML =
        '<div class="kpi-label">' + escHtml(tile.label || 'Tile ' + (i + 1)) + '</div>' +
        '<div class="kpi-count ' + tile.color + '">' + count + '</div>' +
        '<div class="kpi-sub">' + escHtml(subtitle) + '</div>';
      card.addEventListener('click', function () { setActiveTile(i); });
      card.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setActiveTile(i); }
      });
      $grid.appendChild(card);
    });
  }

  function buildColDef(colDef, idx) {
    var key = 'col' + idx;
    var field = colDef.field;

    if (colDef.type === 'date') {
      return {
        key: key, label: colDef.label,
        sortValue: function (row) { return new Date(row[field]).getTime(); },
        renderTd: function (row) { return '<td class="col-date">' + formatDate(row[field]) + '</td>'; }
      };
    }
    if (colDef.type === 'currency') {
      return {
        key: key, label: colDef.label,
        sortValue: function (row) { return parseFloat(row[field]); },
        renderTd: function (row) {
          var raw = parseFloat(row[field]);
          return '<td class="col-acv">' + (isNaN(raw) ? '—' : formatACV(raw)) + '</td>';
        }
      };
    }
    if (colDef.type === 'source') {
      return {
        key: key, label: colDef.label,
        sortValue: function (row) { return String(row[field] || '').toLowerCase(); },
        renderTd: function (row) {
          var src      = String(row[field] || '');
          var srcLower = src.toLowerCase();
          var badgeCls = srcLower.indexOf('landlord') >= 0 ? 'landlord'
                       : srcLower.indexOf('tenant')   >= 0 ? 'tenant'
                       : 'other';
          return '<td><span class="source-badge ' + badgeCls + '">' + escHtml(src || '—') + '</span></td>';
        }
      };
    }
    return { // 'text' default
      key: key, label: colDef.label,
      sortValue: function (row) { return String(row[field] || '').toLowerCase(); },
      renderTd: function (row) { return '<td class="col-tenant">' + escHtml(row[field] || '—') + '</td>'; }
    };
  }

  function renderExitsTable(rows) {
    var tile = cfg.tiles[activeTileIndex] || {};
    var dc   = cfg.displayConfig || {};
    var showRemaining = dc.showRemaining !== false;
    var columns = tile.columns || [];

    document.getElementById('exits-panel-label').textContent =
      tile.label || ('Tile ' + (activeTileIndex + 1));

    var COLS = columns.map(function (colDef, idx) { return buildColDef(colDef, idx); });

    var remainingCol = findRemainingColumn(tile);
    if (remainingCol && showRemaining) {
      COLS.push({
        key: 'remaining', label: 'Remaining',
        sortValue: function (row) { return calcRemainingDays(row[remainingCol.field]); },
        renderTd: function (row) {
          var remaining = calcRemainingDays(row[remainingCol.field]);
          var remText, remCls = '';
          if (remaining === null) {
            remText = '—';
          } else if (remaining <= 0) {
            remText = 'Expired'; remCls = 'urgent';
          } else {
            remText = remaining + ' days';
            if (remaining <= 30)      remCls = 'urgent';
            else if (remaining <= 90) remCls = 'soon';
          }
          return '<td class="col-rem ' + remCls + '">' + remText + '</td>';
        }
      });
    }

    var currencyCols = columns.filter(function (c) { return c.type === 'currency'; });
    var subtitle = rows.length + (rows.length === 1 ? ' row' : ' rows');
    if (currencyCols.length) {
      var totalVal = rows.reduce(function (sum, r) {
        return sum + (parseFloat(r[currencyCols[0].field]) || 0);
      }, 0);
      subtitle += ' · ' + formatACV(totalVal) + ' ' + currencyCols[0].label.toLowerCase();
    }
    document.getElementById('exits-subtitle').textContent = subtitle;

    if (COLS.length === 0) {
      document.getElementById('exits-thead').innerHTML = '';
      document.getElementById('exits-tbody').innerHTML =
        '<tr><td style="padding:16px;color:var(--text-muted);">No columns configured for this tile yet. ' +
        'Add columns in the extension\'s Configure dialog.</td></tr>';
      return;
    }

    var activeCol = COLS.filter(function (c) { return c.key === exitsSort.key; })[0] || COLS[0];
    var sorted = rows.slice().sort(function (a, b) {
      var av = activeCol.sortValue(a);
      var bv = activeCol.sortValue(b);
      var aInvalid = av === null || av === undefined || (typeof av === 'number' && isNaN(av));
      var bInvalid = bv === null || bv === undefined || (typeof bv === 'number' && isNaN(bv));
      if (aInvalid && bInvalid) return 0;
      if (aInvalid) return 1;
      if (bInvalid) return -1;
      var cmp = av < bv ? -1 : av > bv ? 1 : 0;
      return exitsSort.dir === 'desc' ? -cmp : cmp;
    });

    document.getElementById('exits-thead').innerHTML =
      '<tr>' + COLS.map(function (c) {
        var arrow = c.key === exitsSort.key
          ? ' <span class="sort-arrow">' + (exitsSort.dir === 'asc' ? '▲' : '▼') + '</span>'
          : '';
        return '<th class="sortable-th" data-sort-key="' + c.key + '">' + escHtml(c.label) + arrow + '</th>';
      }).join('') + '</tr>';

    var $tbody = document.getElementById('exits-tbody');
    $tbody.innerHTML = '';
    sorted.forEach(function (row) {
      var tr = document.createElement('tr');
      tr.innerHTML = COLS.map(function (c) { return c.renderTd(row); }).join('');
      $tbody.appendChild(tr);
    });
  }

  document.getElementById('exits-thead').addEventListener('click', function (e) {
    var th = e.target.closest('th[data-sort-key]');
    if (!th) return;
    var key = th.getAttribute('data-sort-key');
    if (exitsSort.key === key) {
      exitsSort.dir = exitsSort.dir === 'asc' ? 'desc' : 'asc';
    } else {
      exitsSort.key = key;
      exitsSort.dir = 'asc';
    }
    renderMain();
  });

  function renderDonut(rows) {
    var tile   = cfg.tiles[activeTileIndex] || {};
    var srcCol = findColumnByType(tile, 'source');
    var sfld   = srcCol ? srcCol.field : null;

    var tenantCount = 0, landlordCount = 0;
    if (sfld) {
      rows.forEach(function (r) {
        var src = String(r[sfld] || '').toLowerCase();
        if (src.indexOf('landlord') >= 0) landlordCount++;
        else if (src.indexOf('tenant') >= 0) tenantCount++;
      });
    }

    var total = tenantCount + landlordCount;
    var circ  = 2 * Math.PI * 60;

    var tArc = total > 0 ? (tenantCount   / total) * circ : 0;
    var lArc = total > 0 ? (landlordCount / total) * circ : 0;

    var svg = '<svg viewBox="0 0 160 160" width="140" height="140">' +
      '<circle cx="80" cy="80" r="60" fill="none" stroke="#F0EDE8" stroke-width="22"/>';

    if (total > 0) {
      svg += '<circle cx="80" cy="80" r="60" fill="none" stroke="#F59E0B" stroke-width="22"' +
        ' stroke-dasharray="' + tArc.toFixed(2) + ' ' + circ.toFixed(2) + '"' +
        ' transform="rotate(-90 80 80)"/>';
      svg += '<circle cx="80" cy="80" r="60" fill="none" stroke="#1976D2" stroke-width="22"' +
        ' stroke-dasharray="' + lArc.toFixed(2) + ' ' + circ.toFixed(2) + '"' +
        ' stroke-dashoffset="' + (-tArc).toFixed(2) + '"' +
        ' transform="rotate(-90 80 80)"/>';
    }

    svg +=
      '<text x="80" y="74" text-anchor="middle" font-size="28" font-weight="700"' +
      ' fill="#1A1A1A" font-family="Inter,sans-serif">' + total + '</text>' +
      '<text x="80" y="94" text-anchor="middle" font-size="10" fill="#6B6B6B"' +
      ' font-family="Inter,sans-serif" letter-spacing="1">EXITS</text>' +
      '</svg>';

    document.getElementById('donut-svg-wrap').innerHTML = svg;
    document.getElementById('donut-tenant-count').textContent   = tenantCount;
    document.getElementById('donut-landlord-count').textContent = landlordCount;

    var tenantPct   = total > 0 ? Math.round((tenantCount   / total) * 100) : 0;
    var landlordPct = total > 0 ? Math.round((landlordCount / total) * 100) : 0;
    document.getElementById('donut-insight').textContent =
      tenantCount > landlordCount
        ? 'Tenant-initiated dominates (' + tenantPct + '%). Landlord-initiated accounts for ' + landlordPct + '%.'
        : landlordCount > tenantCount
          ? 'Landlord-initiated dominates (' + landlordPct + '%). Tenant-initiated accounts for ' + tenantPct + '%.'
          : 'Exit split is even between tenant and landlord-initiated.';
  }

  // ── Utilities ──────────────────────────────────────────────────────────────

  function formatACV(n) {
    if (isNaN(n)) return '—';
    if (n >= 1e9) return 'AED ' + (n / 1e9).toFixed(1) + 'B';
    if (n >= 1e6) return 'AED ' + (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return 'AED ' + (n / 1e3).toFixed(0) + 'K';
    return 'AED ' + n.toFixed(0);
  }

  function formatDate(dateStr) {
    var d = new Date(dateStr);
    if (isNaN(d)) return dateStr || '—';
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return ('0' + d.getDate()).slice(-2) + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  function calcRemainingDays(dateStr) {
    var d = new Date(dateStr);
    if (isNaN(d)) return null;
    var now = new Date();
    now.setHours(0, 0, 0, 0);
    d.setHours(0, 0, 0, 0);
    return Math.ceil((d - now) / 864e5);
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showEmpty() {
    $dataCapNotice.style.display = 'none';
    $filterBar.style.display     = 'none';
    $emptyState.style.display    = 'flex';
    $main.style.display          = 'none';
  }

  // ── Filter state ───────────────────────────────────────────────────────────

  function initActiveFilters() {
    var ft = ((cfg.filterConfig || {}).tiles || [])[activeTileIndex] || {};
    activeFilters = {};
    if (ft.dateFilter && ft.dateFilter.enabled) {
      activeFilters.date = { preset: ft.dateFilter.defaultPreset || 'all', from: '', to: '' };
    }
    (ft.categoryFilters || []).forEach(function (catDef, slotIdx) {
      if (catDef.enabled) activeFilters['cat' + slotIdx] = [];
    });
  }

  function applyFilters(rows) {
    var tile = cfg.tiles[activeTileIndex] || {};
    var ft   = ((cfg.filterConfig || {}).tiles || [])[activeTileIndex] || {};
    var out  = rows;

    if (ft.dateFilter && ft.dateFilter.enabled && activeFilters.date) {
      var dateCol = findRemainingColumn(tile) || findColumnByType(tile, 'date');
      if (dateCol) {
        out = applyDateFilter(out, dateCol.field,
          activeFilters.date.preset, activeFilters.date.from, activeFilters.date.to);
      }
    }

    (ft.categoryFilters || []).forEach(function (catDef, slotIdx) {
      var sel = activeFilters['cat' + slotIdx];
      if (!catDef.enabled || !sel || !sel.length) return;
      var colDef = (tile.columns || [])[catDef.columnIndex];
      if (!colDef) return;
      out = out.filter(function (r) { return sel.indexOf(String(r[colDef.field] || '')) >= 0; });
    });

    return out;
  }

  function applyDateFilter(rows, colName, preset, fromStr, toStr) {
    if (preset === 'all') return rows;
    var now = new Date();
    var fromDate, toDate;
    if (preset === 'custom') {
      fromDate = fromStr ? new Date(fromStr) : null;
      toDate   = toStr   ? new Date(toStr)   : null;
    } else {
      toDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      if      (preset === 'mtd')    fromDate = new Date(now.getFullYear(), now.getMonth(), 1);
      else if (preset === 'qtd')    fromDate = new Date(now.getFullYear(), Math.floor(now.getMonth() / 3) * 3, 1);
      else if (preset === 'ytd')    fromDate = new Date(now.getFullYear(), 0, 1);
      else if (preset === 'last30') fromDate = new Date(+now - 30 * 864e5);
      else if (preset === 'last60') fromDate = new Date(+now - 60 * 864e5);
      else if (preset === 'last90') fromDate = new Date(+now - 90 * 864e5);
    }
    return rows.filter(function (row) {
      var d = new Date(row[colName]);
      if (isNaN(d)) return false;
      if (fromDate && d < fromDate) return false;
      if (toDate   && d > toDate)   return false;
      return true;
    });
  }

  // ── Filter bar rendering ───────────────────────────────────────────────────

  var currentDropdownEl = null;

  function renderFilterBar() {
    var tile = cfg.tiles[activeTileIndex] || {};
    var ft   = ((cfg.filterConfig || {}).tiles || [])[activeTileIndex] || {};
    var hasDate = !!(ft.dateFilter && ft.dateFilter.enabled &&
      (findRemainingColumn(tile) || findColumnByType(tile, 'date')));
    var catDefs = (ft.categoryFilters || [])
      .map(function (c, i) { return { def: c, slotIdx: i }; })
      .filter(function (x) { return x.def.enabled && (tile.columns || [])[x.def.columnIndex]; });

    if (!hasDate && !catDefs.length) { $filterBar.style.display = 'none'; return; }

    closeDropdown();
    $filterBar.style.display = 'flex';
    $filterBar.innerHTML = '';

    if (hasDate) $filterBar.appendChild(buildDatePill(ft.dateFilter));
    catDefs.forEach(function (x) {
      var colDef = tile.columns[x.def.columnIndex];
      $filterBar.appendChild(buildCategoryPill({ id: 'cat' + x.slotIdx, label: colDef.label, field: colDef.field }));
    });

    var clearBtn = document.createElement('button');
    clearBtn.className = 'filter-clear-btn';
    clearBtn.innerHTML = '&#215; Clear all';
    clearBtn.addEventListener('click', function () { initActiveFilters(); renderFilterBar(); applyAndRender(); });
    $filterBar.appendChild(clearBtn);
  }

  function buildDatePill(dateConfig) {
    var pill = document.createElement('button');

    function getPreset() { return (activeFilters.date || {}).preset || 'all'; }
    function isActive()  { return getPreset() !== 'all'; }

    function refreshPill() {
      var pillLabel   = (dateConfig && dateConfig.label) ? dateConfig.label : 'Date';
      var preset      = getPreset();
      var found       = null;
      for (var i = 0; i < DATE_PRESETS.length; i++) {
        if (DATE_PRESETS[i].key === preset) { found = DATE_PRESETS[i]; break; }
      }
      var presetLabel = found ? found.label : 'All Time';
      if (preset === 'custom' && activeFilters.date) {
        var f = activeFilters.date.from, t = activeFilters.date.to;
        if (f || t) presetLabel = (f || '…') + ' – ' + (t || '…');
      }
      while (pill.firstChild) pill.removeChild(pill.firstChild);
      var cal = document.createElement('span');
      cal.textContent = isActive() ? pillLabel + ': ' + presetLabel : pillLabel;
      pill.appendChild(cal);
      if (isActive()) {
        var clr = document.createElement('span'); clr.className = 'pill-clear'; clr.textContent = '×';
        clr.addEventListener('click', function (ev) {
          ev.stopPropagation();
          activeFilters.date = { preset: 'all', from: '', to: '' };
          refreshPill(); applyAndRender();
        });
        pill.appendChild(clr);
      }
      var chev = document.createElement('span'); chev.className = 'pill-chevron'; chev.textContent = '▾';
      pill.appendChild(chev);
      pill.className = 'filter-pill' + (isActive() ? ' active' : '');
    }

    refreshPill();

    pill.addEventListener('click', function (e) {
      e.stopPropagation();
      if (currentDropdownEl && pill.classList.contains('open')) { closeDropdown(); return; }
      closeDropdown(); pill.classList.add('open');

      var dropdown = document.createElement('div'); dropdown.className = 'filter-dropdown';
      var body = document.createElement('div'); body.className = 'filter-dropdown-body';
      dropdown.appendChild(body);
      var customDiv = null;

      DATE_PRESETS.forEach(function (p) {
        var item = document.createElement('div');
        item.className = 'date-preset-item' + (getPreset() === p.key ? ' selected' : '');
        var dot = document.createElement('span'); dot.className = 'preset-dot';
        dot.textContent = getPreset() === p.key ? '●' : '○';
        item.appendChild(dot);
        var lbl = document.createElement('span'); lbl.textContent = p.label;
        item.appendChild(lbl);
        item.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (p.key === 'custom') {
            activeFilters.date = { preset: 'custom', from: (activeFilters.date || {}).from || '', to: (activeFilters.date || {}).to || '' };
            body.querySelectorAll('.date-preset-item').forEach(function (it) {
              it.querySelector('.preset-dot').textContent = '○'; it.classList.remove('selected');
            });
            item.querySelector('.preset-dot').textContent = '●'; item.classList.add('selected');
            if (customDiv) customDiv.style.display = 'flex';
            return;
          }
          activeFilters.date = { preset: p.key, from: '', to: '' };
          refreshPill(); closeDropdown(); pill.classList.remove('open'); applyAndRender();
        });
        body.appendChild(item);

        if (p.key === 'custom') {
          customDiv = document.createElement('div');
          customDiv.className = 'date-custom-inputs';
          customDiv.style.display = getPreset() === 'custom' ? 'flex' : 'none';
          var fromRow = document.createElement('div'); fromRow.className = 'date-custom-row';
          var fromLbl = document.createElement('label'); fromLbl.textContent = 'From';
          var fromInp = document.createElement('input'); fromInp.type = 'date';
          fromInp.value = (activeFilters.date || {}).from || '';
          fromRow.appendChild(fromLbl); fromRow.appendChild(fromInp);
          var toRow = document.createElement('div'); toRow.className = 'date-custom-row';
          var toLbl = document.createElement('label'); toLbl.textContent = 'To';
          var toInp = document.createElement('input'); toInp.type = 'date';
          toInp.value = (activeFilters.date || {}).to || '';
          toRow.appendChild(toLbl); toRow.appendChild(toInp);
          var applyBtn = document.createElement('button');
          applyBtn.className = 'date-apply-btn'; applyBtn.textContent = 'Apply';
          applyBtn.addEventListener('click', function (ev) {
            ev.stopPropagation();
            activeFilters.date = { preset: 'custom', from: fromInp.value, to: toInp.value };
            refreshPill(); closeDropdown(); pill.classList.remove('open'); applyAndRender();
          });
          customDiv.appendChild(fromRow); customDiv.appendChild(toRow); customDiv.appendChild(applyBtn);
          body.appendChild(customDiv);
        }
      });

      positionDropdown(dropdown, pill);
      document.body.appendChild(dropdown); currentDropdownEl = dropdown;
      setTimeout(function () { document.addEventListener('click', outsideClickHandler); }, 0);
    });

    return pill;
  }

  function buildCategoryPill(def) {
    var pill = document.createElement('button');

    function getSelected() { return activeFilters[def.id] || []; }
    function isActive()    { return getSelected().length > 0; }

    function refreshPill() {
      var sel = getSelected();
      while (pill.firstChild) pill.removeChild(pill.firstChild);
      var span = document.createElement('span');
      span.textContent = def.label + (sel.length === 0 ? ': All' : '');
      pill.appendChild(span);
      if (sel.length > 0) {
        var badge = document.createElement('span'); badge.className = 'pill-count';
        badge.textContent = sel.length; pill.appendChild(badge);
        var clr = document.createElement('span'); clr.className = 'pill-clear'; clr.textContent = '×';
        clr.addEventListener('click', function (ev) {
          ev.stopPropagation(); activeFilters[def.id] = []; refreshPill(); applyAndRender();
        });
        pill.appendChild(clr);
      }
      var chev = document.createElement('span'); chev.className = 'pill-chevron'; chev.textContent = '▾';
      pill.appendChild(chev);
      pill.className = 'filter-pill' + (isActive() ? ' active' : '');
    }

    refreshPill();

    pill.addEventListener('click', function (e) {
      e.stopPropagation();
      if (currentDropdownEl && pill.classList.contains('open')) { closeDropdown(); return; }
      closeDropdown(); pill.classList.add('open');

      var colName = def.field || null;
      var values  = colName ? getUniqueValues(colName) : [];

      var dropdown = document.createElement('div'); dropdown.className = 'filter-dropdown';
      var body = document.createElement('div'); body.className = 'filter-dropdown-body';
      dropdown.appendChild(body);

      if (values.length === 0) {
        var empty = document.createElement('div'); empty.className = 'filter-dropdown-item';
        empty.style.color = 'var(--text-muted)'; empty.textContent = 'No values found';
        body.appendChild(empty);
      } else {
        values.forEach(function (val) {
          var item = document.createElement('div'); item.className = 'filter-dropdown-item';
          var input = document.createElement('input'); input.type = 'checkbox';
          input.name = 'fpill-' + def.id; input.value = val;
          input.checked = getSelected().indexOf(val) >= 0;
          var labelEl = document.createElement('span'); labelEl.textContent = val || '(blank)';
          input.addEventListener('change', function () {
            var cur = activeFilters[def.id] || [];
            activeFilters[def.id] = input.checked
              ? cur.concat([val])
              : cur.filter(function (v) { return v !== val; });
            refreshPill(); applyAndRender();
          });
          item.appendChild(input); item.appendChild(labelEl);
          item.addEventListener('click', function (ev) { if (ev.target !== input) input.click(); });
          body.appendChild(item);
        });
      }

      if (values.length > 0) {
        var footer = document.createElement('div'); footer.className = 'filter-dropdown-footer';
        var selAll = document.createElement('button'); selAll.textContent = 'Select all';
        selAll.addEventListener('click', function (ev) {
          ev.stopPropagation(); activeFilters[def.id] = values.slice();
          refreshPill(); applyAndRender(); closeDropdown();
        });
        var clearF = document.createElement('button'); clearF.textContent = 'Clear';
        clearF.addEventListener('click', function (ev) {
          ev.stopPropagation(); activeFilters[def.id] = [];
          refreshPill(); applyAndRender(); closeDropdown();
        });
        footer.appendChild(selAll); footer.appendChild(clearF);
        dropdown.appendChild(footer);
      }

      positionDropdown(dropdown, pill);
      document.body.appendChild(dropdown); currentDropdownEl = dropdown;
      setTimeout(function () { document.addEventListener('click', outsideClickHandler); }, 0);
    });

    return pill;
  }

  function getUniqueValues(colName) {
    var seen = {}, vals = [];
    rawRows.forEach(function (row) {
      var v = String(row[colName] || '');
      if (!seen[v]) { seen[v] = true; vals.push(v); }
    });
    return vals.sort();
  }

  function positionDropdown(dropdown, pill) {
    var rect = pill.getBoundingClientRect();
    dropdown.style.top  = (rect.bottom + 6) + 'px';
    dropdown.style.left = rect.left + 'px';
  }

  function closeDropdown() {
    if (currentDropdownEl) { currentDropdownEl.remove(); currentDropdownEl = null; }
    document.removeEventListener('click', outsideClickHandler);
    if ($filterBar) {
      $filterBar.querySelectorAll('.filter-pill.open').forEach(function (p) { p.classList.remove('open'); });
    }
  }

  function outsideClickHandler(e) {
    if (currentDropdownEl && !currentDropdownEl.contains(e.target)) { closeDropdown(); }
  }

  window.addEventListener('load', initTableau);

})();
</script>
</body>
