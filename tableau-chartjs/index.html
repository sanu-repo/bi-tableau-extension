<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chart.js Tableau Extension</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- All JS served locally — no CDN -->
  <script src="js/tableau.extensions.1.latest.min.js"></script>
  <script src="js/chart.umd.js"></script>

  <style>
    /* ── Aldar palette ─────────────────────────────────────────────────────── */
    :root {
      --bg:         #F7F5F0;
      --surface:    #FFFFFF;
      --surface2:   #F0EDE8;
      --border:     #E8E4DD;
      --accent:     #D4782F;
      --text:       #1A1A1A;
      --text-muted: #6B6B6B;
      --danger:     #C62828;
      --radius:     8px;
      --font:       'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ── Reset & base ──────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: transparent;
      color: var(--text);
      overflow: hidden;
    }

    /* ── Layout ────────────────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    #chart-area {
      flex: 1;
      position: relative;
      padding: 12px;
      min-height: 0;
      background: transparent;
    }

    #chartCanvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* ── Toolbar (authoring convenience — hidden in published view) ────────── */
    #toolbar {
      display: none;   /* hidden until explicitly enabled */
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .tb-label {
      font-size: 11px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .05em; white-space: nowrap;
    }
    .tb-select, .tb-input {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; font-family: var(--font);
      padding: 4px 8px; border-radius: 5px; outline: none;
      transition: border-color .15s;
    }
    .tb-select:focus, .tb-input:focus { border-color: var(--accent); }
    .tb-btn {
      background: var(--accent); color: #fff; border: none;
      padding: 5px 12px; border-radius: 5px; font-size: 12px;
      cursor: pointer; white-space: nowrap; transition: opacity .15s;
    }
    .tb-btn:hover { opacity: .85; }
    .tb-btn.secondary {
      background: var(--surface2); color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .tb-btn.secondary:hover { color: var(--text); border-color: var(--accent); }
    .tb-sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

    /* ── Status bar ────────────────────────────────────────────────────────── */
    #status-bar {
      display: none;   /* hidden in published view */
      padding: 3px 12px;
      font-size: 11px; color: var(--text-muted);
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      align-items: center; gap: 8px;
    }
    #status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted); flex-shrink: 0;
    }
    #status-dot.ok  { background: #388E3C; }
    #status-dot.err { background: var(--danger); }

    /* ── Gear button — visible only on hover, authoring mode only ──────────── */
    #gear-btn {
      position: fixed;
      top: 8px; right: 8px;
      z-index: 50;
      width: 30px; height: 30px;
      border-radius: 6px;
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity .14s ease, color .14s, border-color .14s;
    }
    #app:hover #gear-btn        { opacity: 1; }
    #gear-btn:hover             { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>

<div id="app">

  <!-- Toolbar (hidden; kept for optional authoring-mode use) -->
  <div id="toolbar">
    <span class="tb-label">Chart</span>
    <select class="tb-select" id="tb-chart-type"
      onchange="cfg.chartType=this.value; renderChart(); saveConfig()">
      <optgroup label="Basic">
        <option value="bar">Bar</option>
        <option value="line">Line</option>
        <option value="pie">Pie</option>
        <option value="doughnut">Doughnut</option>
        <option value="polarArea">Polar Area</option>
        <option value="radar">Radar</option>
        <option value="scatter">Scatter</option>
        <option value="bubble">Bubble</option>
      </optgroup>
      <optgroup label="Variants">
        <option value="bar-horizontal">Bar (Horizontal)</option>
        <option value="bar-stacked">Bar (Stacked)</option>
        <option value="bar-stacked100">Bar (100% Stacked)</option>
        <option value="line-area">Line (Area)</option>
        <option value="line-stepped">Line (Stepped)</option>
        <option value="line-smooth">Line (Smooth)</option>
      </optgroup>
    </select>

    <div class="tb-sep"></div>

    <span class="tb-label">Title</span>
    <input class="tb-input" id="tb-title" type="text" placeholder="Chart title…" style="width:140px"
      oninput="cfg.options.plugins.title.text=this.value; cfg.options.plugins.title.display=!!this.value; renderChart(); saveConfig()" />

    <div class="tb-sep"></div>

    <button class="tb-btn" onclick="openConfig()">&#9881; Configure</button>
    <button class="tb-btn secondary" onclick="exportChart()">&#8595; Export PNG</button>
  </div>

  <!-- Canvas -->
  <div id="chart-area">
    <canvas id="chartCanvas"></canvas>
  </div>

  <!-- Status bar -->
  <div id="status-bar">
    <div id="status-dot"></div>
    <span id="status-msg">Initializing…</span>
  </div>

  <!-- Gear button (authoring mode only; shown on hover) -->
  <button id="gear-btn" title="Configure chart" aria-label="Configure" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

</div><!-- /#app -->

<script>
'use strict';

// ── Default config ────────────────────────────────────────────────────────────
let cfg = {
  chartType: 'bar',
  useDemo: true,
  tableau: {
    worksheet: '',
    labelField: '',
    datasets: [{ label: 'Series 1', field: '' }]
  },
  colors: [
    '#D4782F','#1976D2','#388E3C','#E65100',
    '#7B1FA2','#455A64','#00838F','#C62828'
  ],
  style: {
    fontFamily: "'Inter', sans-serif",
    fontSize: 12,
    fill: false,
    borderWidth: 2,
    pointRadius: 3,
    backgroundColor: 'transparent'
  },
  axes: {
    x: { display: true, title: '', grid: true },
    y: { display: true, title: '', grid: true, log: false, min: undefined, max: undefined }
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: {},
    plugins: {
      legend:  { display: true, position: 'top' },
      tooltip: { enabled: true },
      title:   { display: false, text: '', align: 'center', font: { size: 16 } }
    }
  }
};

// ── Demo data ─────────────────────────────────────────────────────────────────
const DEMO = {
  labels: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'],
  datasets: [
    { label: 'Revenue',  data: [42, 58, 51, 73, 65, 80, 92, 88] },
    { label: 'Expenses', data: [30, 35, 38, 40, 42, 45, 50, 48] }
  ]
};

// ── State ─────────────────────────────────────────────────────────────────────
let chartInstance   = null;
let tableauData     = null;
let worksheetList   = [];
let dataEventUnsubs = [];
let tableauReady    = false;

// ── Tableau init ──────────────────────────────────────────────────────────────
function initTableau() {
  setStatus('Connecting to Tableau…');
  tableau.extensions.initializeAsync({ configure: openConfig }).then(() => {
    tableauReady = true;
    setStatus('Connected', 'ok');

    const mode = tableau.extensions.environment && tableau.extensions.environment.mode;
    if (!mode || mode === 'authoring') {
      const gear = document.getElementById('gear-btn');
      gear.hidden = false;
      gear.addEventListener('click', openConfig);
    }

    loadSavedConfig();
    initWorksheetData();
  }).catch(() => {
    setStatus('Demo mode — no Tableau connection', 'err');
    cfg.useDemo = true;
    renderChart();
  });
}

function loadSavedConfig() {
  try {
    const saved = tableau.extensions.settings.get('chartjsCfg');
    if (saved) cfg = deepMerge(cfg, JSON.parse(saved));
  } catch(e) {}
}

function saveConfig() {
  try {
    tableau.extensions.settings.set('chartjsCfg', JSON.stringify(cfg));
    tableau.extensions.settings.saveAsync();
  } catch(e) {}
}

// ── Worksheet data ────────────────────────────────────────────────────────────
async function initWorksheetData() {
  try {
    const dashboard = tableau.extensions.dashboardContent.dashboard;
    worksheetList = dashboard.worksheets;
    const ws = worksheetList.find(w => w.name === cfg.tableau.worksheet);
    if (!ws) { renderChart(); return; }
    clearDataListeners();
    registerDataListeners(ws);
    tableauData = await readWorksheetData(ws);
    renderChart();
  } catch(e) {
    renderChart();
  }
}

async function readWorksheetData(ws) {
  if (typeof ws.getSummaryDataReaderAsync === 'function') {
    const reader = await ws.getSummaryDataReaderAsync(10000);
    try {
      return await reader.getAllPagesAsync();
    } finally {
      await reader.releaseAsync();
    }
  }
  return await ws.getSummaryDataAsync();
}

function clearDataListeners() {
  dataEventUnsubs.forEach(unsub => { try { unsub(); } catch(e) {} });
  dataEventUnsubs = [];
}

function registerDataListeners(ws) {
  const refresh = async () => {
    try {
      tableauData = await readWorksheetData(ws);
      if (!cfg.useDemo) renderChart();
    } catch(e) {}
  };
  dataEventUnsubs.push(
    ws.addEventListener(tableau.TableauEventType.FilterChanged, refresh),
    ws.addEventListener(tableau.TableauEventType.MarkSelectionChanged, refresh)
  );
}

// ── Config dialog ─────────────────────────────────────────────────────────────
function openConfig() {
  if (!tableauReady) return;
  const url = window.location.href.replace(/\/[^\/]*$/, '/dialog.html');
  saveConfig();
  tableau.extensions.ui.displayDialogAsync(url, '', { height: 720, width: 560 })
    .then(result => {
      if (result === 'saved') {
        tableauData = null;
        loadSavedConfig();
        initWorksheetData();
      }
    })
    .catch(err => {
      if (err.errorCode !== tableau.ErrorCodes.DialogClosedByUser) {
        console.error('Dialog error:', err);
      }
    });
}

// ── Data assembly ─────────────────────────────────────────────────────────────
function buildChartData() {
  if (cfg.useDemo || !tableauData) return structuredClone(DEMO);

  const labelIdx = tableauData.columns.findIndex(c => c.fieldName === cfg.tableau.labelField);
  if (labelIdx < 0) return structuredClone(DEMO);

  const labels = tableauData.data.map(r => r[labelIdx].formattedValue);
  const datasets = cfg.tableau.datasets
    .filter(d => d.field)
    .map(d => {
      const idx = tableauData.columns.findIndex(c => c.fieldName === d.field);
      return {
        label: d.label || d.field,
        data: tableauData.data.map(r => idx >= 0 ? parseFloat(r[idx].value) || 0 : 0)
      };
    });

  return { labels, datasets: datasets.length ? datasets : DEMO.datasets };
}

// ── Chart rendering ───────────────────────────────────────────────────────────
function resolveChartTypeConfig(type) {
  switch(type) {
    case 'bar-horizontal':  return { type: 'bar',  extra: { indexAxis: 'y' } };
    case 'bar-stacked':     return { type: 'bar',  extra: { scales: { x: { stacked: true }, y: { stacked: true } } } };
    case 'bar-stacked100':  return { type: 'bar',  extra: { scales: { x: { stacked: true }, y: { stacked: true, max: 100 } } } };
    case 'line-area':       return { type: 'line', extra: { fill: true } };
    case 'line-stepped':    return { type: 'line', extra: { stepped: true } };
    case 'line-smooth':     return { type: 'line', extra: { tension: 0.4 } };
    default:                return { type, extra: {} };
  }
}

function applyColorsToDatasetsInPlace(datasets) {
  datasets.forEach((ds, i) => {
    const color = cfg.colors[i % cfg.colors.length] || '#D4782F';
    const rgba  = hexToRgba(color, 0.65);
    ds.backgroundColor = ds.backgroundColor || rgba;
    ds.borderColor     = ds.borderColor     || color;
    ds.borderWidth     = cfg.style.borderWidth;
    ds.pointRadius     = cfg.style.pointRadius;
    ds.fill            = cfg.style.fill;
  });
}

function buildChartConfig() {
  const rawData = buildChartData();
  const { type, extra } = resolveChartTypeConfig(cfg.chartType);
  applyColorsToDatasetsInPlace(rawData.datasets);

  const scales = {};
  if (!['pie','doughnut','polarArea','radar'].includes(type)) {
    scales.x = {
      display: cfg.axes.x.display,
      grid:    { display: cfg.axes.x.grid },
      title:   { display: !!cfg.axes.x.title, text: cfg.axes.x.title },
      ...(extra.scales && extra.scales.x ? extra.scales.x : {})
    };
    scales.y = {
      display: cfg.axes.y.display,
      type:    cfg.axes.y.log ? 'logarithmic' : 'linear',
      grid:    { display: cfg.axes.y.grid },
      title:   { display: !!cfg.axes.y.title, text: cfg.axes.y.title },
      min:     cfg.axes.y.min !== '' ? cfg.axes.y.min : undefined,
      max:     cfg.axes.y.max !== '' ? cfg.axes.y.max : undefined,
      ...(extra.scales && extra.scales.y ? extra.scales.y : {})
    };
  }

  if (extra.fill    !== undefined) rawData.datasets.forEach(d => { d.fill    = extra.fill;    });
  if (extra.tension !== undefined) rawData.datasets.forEach(d => { d.tension = extra.tension; });
  if (extra.stepped !== undefined) rawData.datasets.forEach(d => { d.stepped = extra.stepped; });

  return {
    type,
    data: rawData,
    options: {
      responsive:           cfg.options.responsive,
      maintainAspectRatio:  cfg.options.maintainAspectRatio,
      animation:            cfg.options.animation,
      indexAxis:            extra.indexAxis || 'x',
      plugins: {
        legend:  Object.assign({}, cfg.options.plugins.legend),
        tooltip: Object.assign({}, cfg.options.plugins.tooltip),
        title:   Object.assign({}, cfg.options.plugins.title)
      },
      scales
    }
  };
}

function renderChart() {
  const canvas = document.getElementById('chartCanvas');
  const ctx    = canvas.getContext('2d');
  canvas.style.background = cfg.style.backgroundColor;

  Chart.defaults.font.family = cfg.style.fontFamily;
  Chart.defaults.font.size   = cfg.style.fontSize;
  Chart.defaults.color       = '#6B6B6B';  // Aldar text-muted on light bg

  if (chartInstance) {
    chartInstance.destroy();
    chartInstance = null;
  }

  try {
    chartInstance = new Chart(ctx, buildChartConfig());
    setStatus('Chart rendered — ' + cfg.chartType + (cfg.useDemo ? ' (demo data)' : ''), 'ok');
  } catch(e) {
    setStatus('Render error: ' + e.message, 'err');
    console.error(e);
  }
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportChart() {
  if (!chartInstance) return;
  const a = document.createElement('a');
  a.download = 'chart-export.png';
  a.href = chartInstance.toBase64Image('image/png', 1);
  a.click();
}

// ── Status ────────────────────────────────────────────────────────────────────
function setStatus(msg, state) {
  document.getElementById('status-msg').textContent = msg;
  const dot = document.getElementById('status-dot');
  dot.className = state || '';
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

function deepMerge(target, source) {
  const out = Object.assign({}, target);
  for (const k in source) {
    if (source[k] && typeof source[k] === 'object' && !Array.isArray(source[k])) {
      out[k] = deepMerge(target[k] || {}, source[k]);
    } else {
      out[k] = source[k];
    }
  }
  return out;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  renderChart();   // show demo chart immediately while Tableau connects
  initTableau();
});
</script>
</body>
</html>
